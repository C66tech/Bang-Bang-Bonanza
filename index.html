<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Versione Gioco: v1.1.0 -->
  <meta name="game-version" content="1.1.0">
  
  <!-- Tag Anti-Caching per forzare sempre il download della versione aggiornata -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Point Panic! XR - v1.1.0</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    #xr-button-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
    }

    .xr-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .xr-btn:hover {
      background: #fff;
      color: #000;
    }

    .xr-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #888;
    }

    /* Badge Versione 2D sullo Schermo (Fuori da XR) */
    #version-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00ffcc;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #00ffcc;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="version-badge">v1.1.0</div>

<div id="xr-button-container">
  <button id="vr-btn" class="xr-btn">ENTER VR</button>
  <button id="ar-btn" class="xr-btn">ENTER AR</button>
</div>

<script>
  // Costante di Versione Principale
  const GAME_VERSION = "v1.1.0";

  let scene, camera, renderer, controller;
  let raycaster, tempMatrix;
  let currentSession = null;

  // Pannello Info 3D
  let hudCanvas, hudContext, hudTexture, hudMesh;

  let score = 0;
  let activeTargets = [];
  const TARGET_LIFESPAN = 2000;

  const COLOR_CONFIG = [
    { color: 0xff0000, points: 10 },
    { color: 0x00ff00, points: 10 },
    { color: 0x0000ff, points: 10 },
    { color: 0xffff00, points: 20 },
    { color: 0x111111, points: -30 }
  ];

  init();
  animate();

  function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 5, 5).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    raycaster = new THREE.Raycaster();
    tempMatrix = new THREE.Matrix4();

    // Controller Destro (Pistola)
    controller = renderer.xr.getController(0);
    controller.addEventListener('selectstart', onTriggerPress);
    scene.add(controller);

    const gunGroup = new THREE.Group();
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.015, 0.015, 0.2),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    barrel.rotation.x = -Math.PI / 2;
    barrel.position.z = -0.1;
    gunGroup.add(barrel);

    const laserGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -5)
    ]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0xff0000, opacity: 0.6, transparent: true });
    gunGroup.add(new THREE.Line(laserGeo, laserMat));

    controller.add(gunGroup);

    // Creazione Pannello HUD a Sinistra
    createLeftHUD();

    setupXRButtons();

    setInterval(spawnTarget, 800);
  }

  // Pannello 3D renderizzato sulla Sinistra del Giocatore
  function createLeftHUD() {
    hudCanvas = document.createElement('canvas');
    hudCanvas.width = 512;
    hudCanvas.height = 512;
    hudContext = hudCanvas.getContext('2d');

    hudTexture = new THREE.CanvasTexture(hudCanvas);
    const hudMaterial = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
    const hudGeometry = new THREE.PlaneGeometry(0.8, 0.8);

    hudMesh = new THREE.Mesh(hudGeometry, hudMaterial);
    
    // Posizionamento sulla sinistra del giocatore (X: -1.2, Y: 1.4, Z: -1.5) e ruotato verso il centro
    hudMesh.position.set(-1.2, 1.4, -1.5);
    hudMesh.rotation.y = Math.PI / 6;

    scene.add(hudMesh);
    updateHUDText();
  }

  // Aggiorna la grafica del pannello sinistro
  function updateHUDText() {
    hudContext.clearRect(0, 0, hudCanvas.width, hudCanvas.height);

    // Sfondo Pannello
    hudContext.fillStyle = 'rgba(10, 15, 30, 0.85)';
    hudContext.strokeStyle = '#00ffcc';
    hudContext.lineWidth = 6;
    hudContext.beginPath();
    hudContext.roundRect(10, 10, 492, 492, 20);
    hudContext.fill();
    hudContext.stroke();

    // Testo Titolo e Versione
    hudContext.fillStyle = '#00ffcc';
    hudContext.font = 'bold 36px monospace';
    hudContext.fillText('POINT PANIC! XR', 40, 70);

    hudContext.fillStyle = '#ffffff';
    hudContext.font = '28px monospace';
    hudContext.fillText(`VERSION: ${GAME_VERSION}`, 40, 120);

    // Linea Divisoria
    hudContext.strokeStyle = '#00ffcc';
    hudContext.lineWidth = 2;
    hudContext.beginPath();
    hudContext.moveTo(40, 140);
    hudContext.lineTo(470, 140);
    hudContext.stroke();

    // Statistiche di Gioco
    hudContext.fillStyle = '#ffcc00';
    hudContext.font = 'bold 42px monospace';
    hudContext.fillText(`SCORE: ${score}`, 40, 210);

    hudContext.fillStyle = '#cccccc';
    hudContext.font = '24px sans-serif';
    hudContext.fillText('Minigame 1: Sphere Panic', 40, 270);
    hudContext.fillText('• Red/Green/Blue: +10', 40, 320);
    hudContext.fillText('• Yellow Bonus:  +20', 40, 360);
    hudContext.fillText('• Black Penalty: -30', 40, 400);

    hudTexture.needsUpdate = true;
  }

  function setupXRButtons() {
    const vrBtn = document.getElementById('vr-btn');
    const arBtn = document.getElementById('ar-btn');

    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        vrBtn.disabled = !supported;
      });
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        arBtn.disabled = !supported;
      });

      vrBtn.addEventListener('click', () => onRequestSession('immersive-vr'));
      arBtn.addEventListener('click', () => onRequestSession('immersive-ar'));
    } else {
      vrBtn.disabled = true;
      arBtn.disabled = true;
      vrBtn.textContent = 'XR Not Supported';
    }
  }

  async function onRequestSession(mode) {
    if (currentSession) {
      currentSession.end();
      return;
    }

    try {
      const session = await navigator.xr.requestSession(mode, {
        optionalFeatures: ['local-floor', 'bounded-floor']
      });

      currentSession = session;
      renderer.xr.setSession(session);

      if (mode === 'immersive-ar') {
        scene.background = null;
      } else {
        scene.background = new THREE.Color(0x111122);
      }

      session.addEventListener('end', () => {
        currentSession = null;
        document.getElementById('vr-btn').textContent = 'ENTER VR';
        document.getElementById('ar-btn').textContent = 'ENTER AR';
      });

      document.getElementById('vr-btn').textContent = mode === 'immersive-vr' ? 'EXIT VR' : 'ENTER VR';
      document.getElementById('ar-btn').textContent = mode === 'immersive-ar' ? 'EXIT AR' : 'ENTER AR';

    } catch (e) {
      console.error(`Impossibile avviare la sessione ${mode}:`, e);
    }
  }

  function spawnTarget() {
    const config = COLOR_CONFIG[Math.floor(Math.random() * COLOR_CONFIG.length)];
    const geometry = new THREE.SphereGeometry(0.12, 16, 16);
    const material = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.3 });
    const sphere = new THREE.Mesh(geometry, material);

    sphere.position.x = (Math.random() - 0.5) * 2;
    sphere.position.y = 1.0 + Math.random() * 1.0;
    sphere.position.z = -1.2 - Math.random() * 1.3;

    sphere.userData = {
      points: config.points,
      spawnTime: performance.now()
    };

    scene.add(sphere);
    activeTargets.push(sphere);
  }

  function onTriggerPress() {
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    const intersects = raycaster.intersectObjects(activeTargets);

    if (intersects.length > 0) {
      const hitObject = intersects[0].object;
      score += hitObject.userData.points;
      updateHUDText(); // Aggiorna il punteggio sul pannello a sinistra
      destroyTarget(hitObject);
    }
  }

  function destroyTarget(target) {
    scene.remove(target);
    target.geometry.dispose();
    target.material.dispose();
    activeTargets = activeTargets.filter(t => t !== target);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render() {
    const now = performance.now();
    for (let i = activeTargets.length - 1; i >= 0; i--) {
      const target = activeTargets[i];
      if (now - target.userData.spawnTime > TARGET_LIFESPAN) {
        destroyTarget(target);
      }
    }
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
