<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- TAG META ANTI-CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>WebXR Red Gun Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    /* RETTANGOLO HUD SULLA SINISTRA */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 220px;
      background: rgba(10, 15, 30, 0.85);
      border: 2px solid #00ffcc;
      border-radius: 8px;
      padding: 16px;
      color: #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      z-index: 100;
      pointer-events: auto;
    }
    .hud-header {
      font-size: 12px;
      color: #88ffeb;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .hud-version {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(0, 255, 204, 0.3);
      padding-bottom: 6px;
    }
    .hud-score {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    #hud-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-btn {
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .hud-btn:hover {
      background: #00ffcc;
      color: #000;
    }
    .hud-btn:active {
      transform: scale(0.96);
    }
  </style>

  <!-- Import Map Three.js via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- HUD RETTANGOLARE SULLA SINISTRA -->
  <div id="ui-overlay">
    <div class="hud-header">WebXR Shooter</div>
    <div class="hud-version">Versione: v1.3.0</div>
    <div class="hud-score">Punti: <span id="score">0</span></div>
    
    <div id="hud-controls">
      <button class="hud-btn" id="btn-pitch-down">Inclina Avanti ⤵</button>
      <button class="hud-btn" id="btn-pitch-up">Inclina Indietro ⤴</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let scene, camera, renderer;
    let controllers = [];
    let gunPivots = [];
    let bullets = [];
    let targets = [];
    let score = 0;
    let currentGunPitch = 0;
    const clock = new THREE.Clock();

    init();

    function init() {
      // 1. Scena 3D
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101020);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      // 3. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 4. Renderer WebGL + WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 5. Bottoni di ingresso VR e AR
      document.body.appendChild(VRButton.createButton(renderer));
      document.body.appendChild(ARButton.createButton(renderer));

      // 6. Setup Controller e Pistola
      setupControllers();

      // 7. Eventi Pulsanti HUD per Rotazione Pistola
      setupHudControls();

      // 8. Spawna bersagli vicino al pavimento
      for (let i = 0; i < 8; i++) {
        spawnTarget();
      }

      window.addEventListener('resize', onWindowResize);

      // Render Loop per WebXR
      renderer.setAnimationLoop(animate);
    }

    // Creazione Modello Pistola
    function createRedGunModel() {
      const gunGroup = new THREE.Group();

      const redGunMat = new THREE.MeshStandardMaterial({ 
        color: 0xe60000, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const blackDetailMat = new THREE.MeshStandardMaterial({ 
        color: 0x111111, 
        roughness: 0.6 
      });

      // Canna
      const barrelGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.26, 16);
      barrelGeo.rotateX(Math.PI / 2);
      const barrel = new THREE.Mesh(barrelGeo, redGunMat);
      barrel.position.set(0, 0, -0.1);
      gunGroup.add(barrel);

      // Impugnatura
      const handleGeo = new THREE.BoxGeometry(0.03, 0.12, 0.04);
      const handle = new THREE.Mesh(handleGeo, blackDetailMat);
      handle.position.set(0, -0.05, 0.02);
      handle.rotation.x = -0.3;
      gunGroup.add(handle);

      // Mirino Posteriore
      const rearSightGeo = new THREE.BoxGeometry(0.016, 0.012, 0.005);
      const rearSight = new THREE.Mesh(rearSightGeo, blackDetailMat);
      rearSight.position.set(0, 0.025, 0.02);
      gunGroup.add(rearSight);

      // Mirino Anteriore
      const frontSightGeo = new THREE.BoxGeometry(0.006, 0.012, 0.006);
      const frontSightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const frontSight = new THREE.Mesh(frontSightGeo, frontSightMat);
      frontSight.position.set(0, 0.025, -0.22);
      gunGroup.add(frontSight);

      // Laser
      const laserGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.23),
        new THREE.Vector3(0, 0, -15)
      ]);
      const laserMat = new THREE.LineBasicMaterial({ 
        color: 0xff0000, 
        transparent: true, 
        opacity: 0.6 
      });
      const laserLine = new THREE.Line(laserGeo, laserMat);
      gunGroup.add(laserLine);

      return gunGroup;
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);

        const pivot = new THREE.Group();
        const gun = createRedGunModel();
        
        pivot.add(gun);
        controller.add(pivot);

        controller.addEventListener('selectstart', onShoot);

        scene.add(controller);
        controllers.push(controller);
        gunPivots.push(pivot);
      }
    }

    function setupHudControls() {
      const step = THREE.MathUtils.degToRad(5);

      document.getElementById('btn-pitch-down').addEventListener('click', () => {
        currentGunPitch += step;
        updateGunRotation();
      });

      document.getElementById('btn-pitch-up').addEventListener('click', () => {
        currentGunPitch -= step;
        updateGunRotation();
      });
    }

    function updateGunRotation() {
      gunPivots.forEach(pivot => {
        pivot.rotation.x = currentGunPitch;
      });
    }

    function onShoot(event) {
      const controller = event.target;

      const bulletGeo = new THREE.SphereGeometry(0.025, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      const pivot = controller.children.find(c => gunPivots.includes(c));
      
      if (pivot) {
        pivot.getWorldPosition(bullet.position);

        const direction = new THREE.Vector3(0, 0, -1);
        const worldQuaternion = new THREE.Quaternion();
        pivot.getWorldQuaternion(worldQuaternion);
        direction.applyQuaternion(worldQuaternion);

        // Velocità incrementata da 18 a 45 m/s
        bullet.userData = {
          velocity: direction.multiplyScalar(45),
          life: 0
        };

        scene.add(bullet);
        bullets.push(bullet);
      }
    }

    function spawnTarget() {
      const geo = new THREE.IcosahedronGeometry(0.18, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.2,
        metalness: 0.7
      });
      const target = new THREE.Mesh(geo, mat);

      target.position.x = (Math.random() - 0.5) * 4;
      target.position.y = 0.15 + Math.random() * 0.3; 
      target.position.z = -1.5 - Math.random() * 3;

      scene.add(target);
      targets.push(target);
    }

    function updateBullets(delta) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.position.addScaledVector(bullet.userData.velocity, delta);
        bullet.userData.life += delta;

        for (let j = targets.length - 1; j >= 0; j--) {
          const target = targets[j];
          const dist = bullet.position.distanceTo(target.position);

          if (dist < 0.22) {
            scene.remove(target);
            targets.splice(j, 1);

            scene.remove(bullet);
            bullets.splice(i, 1);

            score += 100;
            document.getElementById('score').textContent = score;

            spawnTarget();
            break;
          }
        }

        if (bullet.userData.life > 2.5 && bullets.includes(bullet)) {
          scene.remove(bullet);
          bullets.splice(i, 1);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();

      targets.forEach(t => {
        t.rotation.x += 0.8 * delta;
        t.rotation.y += 1.0 * delta;
      });

      updateBullets(delta);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
