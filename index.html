<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffcc;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <!-- Import Map per caricare Three.js ed i moduli WebXR -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui-overlay">Punti: <span id="score">0</span></div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let scene, camera, renderer;
    let controllers = [];
    let bullets = [];
    let targets = [];
    let score = 0;
    const clock = new THREE.Clock();

    init();

    function init() {
      // 1. Scena 3D
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101020);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      // 3. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 4. Griglia di riferimento per il pavimento (VR)
      const grid = new THREE.GridHelper(20, 20, 0x00ffcc, 0x444444);
      grid.position.y = 0;
      scene.add(grid);

      // 5. Renderer WebGL + Abilita WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 6. Bottoni di ingresso Sessione AR / VR
      document.body.appendChild(VRButton.createButton(renderer));
      document.body.appendChild(ARButton.createButton(renderer));

      // 7. Setup Controller e Pistole
      setupControllers();

      // 8. Genera i primi bersagli
      for (let i = 0; i < 8; i++) {
        spawnTarget();
      }

      window.addEventListener('resize', onWindowResize);

      // Render Loop per WebXR
      renderer.setAnimationLoop(animate);
    }

    // Creo un modello di pistola Procedurale
    function createGunModel() {
      const gunGroup = new THREE.Group();

      // Canna della pistola
      const barrelGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.25, 16);
      barrelGeo.rotateX(Math.PI / 2);
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0.8 });
      const barrel = new THREE.Mesh(barrelGeo, gunMat);
      barrel.position.set(0, 0, -0.1);
      gunGroup.add(barrel);

      // Impugnatura
      const handleGeo = new THREE.BoxGeometry(0.03, 0.12, 0.04);
      const handle = new THREE.Mesh(handleGeo, gunMat);
      handle.position.set(0, -0.05, 0.02);
      handle.rotation.x = -0.3;
      gunGroup.add(handle);

      // Mirino Laser Verde
      const sightGeo = new THREE.BoxGeometry(0.008, 0.008, 0.01);
      const sightMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      const sight = new THREE.Mesh(sightGeo, sightMat);
      sight.position.set(0, 0.022, -0.2);
      gunGroup.add(sight);

      return gunGroup;
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);

        // Aggiunge il modello della pistola al controller
        const gun = createGunModel();
        controller.add(gun);

        // Evento sparo al grilletto (Select)
        controller.addEventListener('selectstart', onShoot);

        scene.add(controller);
        controllers.push(controller);
      }
    }

    function onShoot(event) {
      const controller = event.target;

      // Creo il proiettile
      const bulletGeo = new THREE.SphereGeometry(0.02, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      // Posiziona il proiettile sulla punta della pistola
      controller.getWorldPosition(bullet.position);

      // Calcola la direzione (-Z rispetto al controller)
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(controller.getWorldQuaternion(new THREE.Quaternion()));

      bullet.userData = {
        velocity: direction.multiplyScalar(15), // Velocità del proiettile
        life: 0
      };

      scene.add(bullet);
      bullets.push(bullet);
    }

    function spawnTarget() {
      const geo = new THREE.IcosahedronGeometry(0.2, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.2,
        metalness: 0.6
      });
      const target = new THREE.Mesh(geo, mat);

      // Posizionamento casuale davanti al giocatore
      target.position.x = (Math.random() - 0.5) * 4;
      target.position.y = 1 + Math.random() * 1.5;
      target.position.z = -2 - Math.random() * 3;

      scene.add(target);
      targets.push(target);
    }

    function updateBullets(delta) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.position.addScaledVector(bullet.userData.velocity, delta);
        bullet.userData.life += delta;

        // Collisioni con i bersagli
        for (let j = targets.length - 1; j >= 0; j--) {
          const target = targets[j];
          const dist = bullet.position.distanceTo(target.position);

          if (dist < 0.22) { // Impatto avvenuto
            scene.remove(target);
            targets.splice(j, 1);

            scene.remove(bullet);
            bullets.splice(i, 1);

            score += 100;
            document.getElementById('score').textContent = score;

            spawnTarget(); // Rigenera bersaglio
            break;
          }
        }

        // Rimuovi proiettili vecchi dopo 3 secondi
        if (bullet.userData.life > 3 && bullets.includes(bullet)) {
          scene.remove(bullet);
          bullets.splice(i, 1);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();

      // Rotazione bersagli
      targets.forEach(t => {
        t.rotation.x += 0.6 * delta;
        t.rotation.y += 0.8 * delta;
      });

      // Aggiornamento posizioni e collisioni
      updateBullets(delta);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
