<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Bang Bang Bonanza - WebXR Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    #xr-button-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 1000;
    }

    #xr-button-container button {
      position: static !important;
      left: auto !important;
      bottom: auto !important;
      transform: none !important;
      margin: 0 !important;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, floorWireframe;
    let controllers = [], gunPivots = [], laserLines = [], tracers = [], hudButtons = [], explosions = [], floatingTexts = [];
    let score = 0;
    let gameState = 'LOBBY';
    let currentGunPitch = THREE.MathUtils.degToRad(-14);
    let laserEnabled = true;
    let activeMiniGame = null, miniGameList = [], currentMiniGameIndex = 0;
    let audioCtx = null;
    let hudCanvas, hudCtx, hudTexture;
    let btnPitchDownMesh, btnPitchUpMesh, btnLaserToggleMesh, btnGameSelectMesh, btnStartMesh;
    let logoMesh = null;
    let timerMesh = null, timerCanvas = null, timerCtx = null, timerTexture = null;
    const clock = new THREE.Clock();

    // ==========================================
    // MINIGAME 1: COLOR PYRAMID
    // ==========================================
    class MiniGame1 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Color Pyramid";
        this.duration = 20;
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.spheres = [];
        this.targetCube = null;
        this.targetColorObj = null;
        this.colorPalette = [
          { name: 'Yellow', hex: 0xffff00, points: 100 },
          { name: 'Green',  hex: 0x00ff00, points: 100 },
          { name: 'Red',    hex: 0xff0000, points: 100 },
          { name: 'Blue',   hex: 0x0066ff, points: 100 },
          { name: 'Orange', hex: 0xff8800, points: 100 },
          { name: 'Purple', hex: 0x9900ff, points: 100 },
          { name: 'Black',  hex: 0x111111, points: -100 }
        ];
      }

      init() {
        this.cleanup();
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        updateTimerDisplay(this.timeRemaining);

        this.createTargetCubeMesh();
        this.generateWave();
      }

      createTargetCubeMesh() {
        const geo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        const mat = new THREE.MeshStandardMaterial({ roughness: 0.2, metalness: 0.5 });
        this.targetCube = new THREE.Mesh(geo, mat);
        this.targetCube.position.set(1.2, 0.95, -2.0);
        this.scene.add(this.targetCube);
      }

      generateWave() {
        this.spheres.forEach(s => { this.scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
        this.spheres = [];

        const validColors = this.colorPalette.filter(c => c.points > 0);
        this.targetColorObj = validColors[Math.floor(Math.random() * validColors.length)];
        this.targetCube.material.color.setHex(this.targetColorObj.hex);

        const otherColors = this.colorPalette.filter(c => c.hex !== this.targetColorObj.hex);

        const totalSpheres = 21;
        const indices = Array.from({ length: totalSpheres }, (_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const targetIndices = new Set(indices.slice(0, 5));

        const rows = 6;
        const spacingX = 0.28, spacingY = 0.22;
        const startY = 1.35, centerZ = -2.2;
        const geo = new THREE.SphereGeometry(0.11, 24, 24);

        let sphereCount = 0;
        for (let r = 0; r < rows; r++) {
          const countInRow = r + 1;
          const startX = -((countInRow - 1) * spacingX) / 2;
          for (let c = 0; c < countInRow; c++) {
            let chosenColor = targetIndices.has(sphereCount) ? this.targetColorObj : otherColors[Math.floor(Math.random() * otherColors.length)];
            const mat = new THREE.MeshStandardMaterial({ color: chosenColor.hex, roughness: 0.2, metalness: 0.5 });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set(startX + c * spacingX, startY - r * spacingY, centerZ);
            sphere.userData = { colorInfo: chosenColor, active: true };
            this.scene.add(sphere);
            this.spheres.push(sphere);

            sphereCount++;
          }
        }
      }

      getTargetObjects() {
        return this.spheres.filter(s => s.userData.active && s.visible);
      }

      onHit(hitObject) {
        if (this.isGameOver) return { points: 0, combo: 1 };
        const sphere = this.spheres.find(s => s === hitObject);
        if (!sphere || !sphere.userData.active || !sphere.visible) return { points: 0, combo: 1 };

        sphere.userData.active = false;
        sphere.visible = false;

        const isCorrect = (sphere.userData.colorInfo.hex === this.targetColorObj.hex);
        const earnedPoints = isCorrect ? 100 : -100;

        const remainingTargetSpheres = this.spheres.filter(s => s.userData.active && s.visible && s.userData.colorInfo.hex === this.targetColorObj.hex);

        if (remainingTargetSpheres.length === 0) {
          setTimeout(() => {
            if (gameState === 'PLAYING' && !this.isGameOver) {
              this.generateWave();
            }
          }, 300);
        }

        return { points: earnedPoints, combo: 1 };
      }

      update(delta) {
        if (this.isGameOver) return;

        this.timeRemaining -= delta;
        const currentSec = Math.ceil(this.timeRemaining);

        if (currentSec < this.lastSecondBeep && currentSec >= 0) {
          this.lastSecondBeep = currentSec;
          playBeepSound(currentSec <= 5);
          updateTimerDisplay(this.timeRemaining);
        }

        if (this.timeRemaining <= 0 && !this.isGameOver) {
          this.isGameOver = true;
          updateTimerDisplay(0);
          playBellSound();
          this.spheres.forEach(s => { s.userData.active = false; s.visible = false; });
          if (this.targetCube) this.targetCube.visible = false;

          setTimeout(() => {
            stopCurrentGame();
          }, 2000);
          return;
        }

        this.spheres.forEach(s => { if (s.userData.active && s.visible) s.rotation.y += 0.8 * delta; });
        if (this.targetCube && this.targetCube.visible) {
          this.targetCube.rotation.y += 1.2 * delta;
          this.targetCube.rotation.x += 0.6 * delta;
        }
      }

      cleanup() {
        this.spheres.forEach(s => { this.scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
        this.spheres = [];
        if (this.targetCube) {
          this.scene.remove(this.targetCube);
          this.targetCube.geometry.dispose();
          this.targetCube.material.dispose();
          this.targetCube = null;
        }
      }
    }

    // ==========================================
    // MINIGAME 2: COMBO STREAK
    // ==========================================
    class MiniGame2 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Combo Streak";
        this.duration = 20;
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.spheres = [];
        this.waveTimer = 0;
        this.isWaveActive = true;
        this.lastColorHex = null;
        this.comboStreak = 1;
        this.colorPalette = [
          { name: 'Yellow', hex: 0xffff00, points: 100 },
          { name: 'Green',  hex: 0x00ff00, points: 100 },
          { name: 'Red',    hex: 0xff0000, points: 100 },
          { name: 'Blue',   hex: 0x0066ff, points: 100 },
          { name: 'Orange', hex: 0xff8800, points: 100 },
          { name: 'Purple', hex: 0x9900ff, points: 100 },
          { name: 'Black',  hex: 0x111111, points: -100 }
        ];
      }

      init() {
        this.cleanup();
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.waveTimer = 0;
        this.isWaveActive = true;
        this.lastColorHex = null;
        this.comboStreak = 1;
        updateTimerDisplay(this.timeRemaining);

        const count = 6, spacingX = 0.40;
        const startX = -((count - 1) * spacingX) / 2;
        const posY = 0.90, posZ = -2.2;
        const geo = new THREE.SphereGeometry(0.14, 24, 24);

        for (let i = 0; i < count; i++) {
          const colorObj = this.getRandomColorObj();
          const mat = new THREE.MeshStandardMaterial({ color: colorObj.hex, roughness: 0.2, metalness: 0.5 });
          const sphere = new THREE.Mesh(geo, mat);
          sphere.position.set(startX + i * spacingX, posY, posZ);
          sphere.userData = { colorInfo: colorObj, active: true };
          this.scene.add(sphere);
          this.spheres.push(sphere);
        }
      }

      getRandomColorObj() {
        return this.colorPalette[Math.floor(Math.random() * this.colorPalette.length)];
      }

      getTargetObjects() {
        return this.spheres.filter(s => s.userData.active && s.visible);
      }

      onHit(hitObject) {
        if (this.isGameOver) return { points: 0, combo: 1 };
        const sphere = this.spheres.find(s => s === hitObject);
        if (!sphere || !sphere.userData.active || !sphere.visible) return { points: 0, combo: 1 };

        const colorHex = sphere.userData.colorInfo.hex;
        const basePoints = sphere.userData.colorInfo.points;

        if (this.lastColorHex !== null && this.lastColorHex === colorHex && basePoints > 0) {
          this.comboStreak++;
        } else {
          this.lastColorHex = colorHex;
          this.comboStreak = 1;
        }

        const multiplier = this.comboStreak;
        const finalPoints = basePoints * multiplier;

        sphere.userData.active = false;
        sphere.visible = false;

        return { points: finalPoints, combo: multiplier };
      }

      update(delta) {
        if (this.isGameOver) return;

        this.timeRemaining -= delta;
        const currentSec = Math.ceil(this.timeRemaining);

        if (currentSec < this.lastSecondBeep && currentSec >= 0) {
          this.lastSecondBeep = currentSec;
          playBeepSound(currentSec <= 5);
          updateTimerDisplay(this.timeRemaining);
        }

        if (this.timeRemaining <= 0 && !this.isGameOver) {
          this.isGameOver = true;
          updateTimerDisplay(0);
          playBellSound();
          this.spheres.forEach(s => { s.userData.active = false; s.visible = false; });

          setTimeout(() => {
            stopCurrentGame();
          }, 2000);
          return;
        }

        this.waveTimer += delta;
        if (this.isWaveActive && this.waveTimer >= 2.0) {
          this.isWaveActive = false;
          this.spheres.forEach(s => { s.userData.active = false; s.visible = false; });
          playDullSound(1.0);
        } else if (!this.isWaveActive && this.waveTimer >= 3.0) {
          this.waveTimer = 0;
          this.isWaveActive = true;
          this.lastColorHex = null;
          this.comboStreak = 1;

          this.spheres.forEach(s => {
            const newColor = this.getRandomColorObj();
            s.userData.colorInfo = newColor;
            s.material.color.setHex(newColor.hex);
            s.userData.active = true;
            s.visible = true;
          });
        }
        this.spheres.forEach(s => { if (s.visible) s.rotation.y += 0.8 * delta; });
      }

      cleanup() {
        this.spheres.forEach(s => { this.scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
        this.spheres = [];
      }
    }

    // ==========================================
    // MINIGAME 3: GRID SLIDER 15 (Classic 15-Puzzle)
    // ==========================================
    class MiniGame3 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Grid Slider 15";
        this.duration = 60; // Esteso a 60 secondi
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.grid = new Array(16).fill(null);
        this.emptyIndex = 15;
        this.tiles = [];
      }

      init() {
        this.cleanup();
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        updateTimerDisplay(this.timeRemaining);

        this.createBoard();
        this.shuffleBoard(14);
      }

      getPosForGridIndex(idx) {
        const row = Math.floor(idx / 4);
        const col = idx % 4;
        const spacingX = 0.32;
        const spacingY = 0.32;
        const startX = -1.5 * spacingX;
        const startY = 1.35;
        return new THREE.Vector3(startX + col * spacingX, startY - row * spacingY, -2.2);
      }

      createBoard() {
        const geo = new THREE.BoxGeometry(0.28, 0.28, 0.04);
        for (let num = 1; num <= 15; num++) {
          const canvas = document.createElement('canvas');
          canvas.width = 128; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#0d222a'; ctx.fillRect(0, 0, 128, 128);
          ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 120, 120);
          ctx.fillStyle = '#ffea00'; ctx.font = 'bold 54px Arial';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(num.toString(), 64, 64);

          const tex = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.3 });
          const mesh = new THREE.Mesh(geo, mat);

          const initialIdx = num - 1;
          const pos = this.getPosForGridIndex(initialIdx);
          mesh.position.copy(pos);
          mesh.userData = { number: num, gridIdx: initialIdx, targetPos: pos.clone() };

          this.scene.add(mesh);
          this.tiles.push(mesh);
          this.grid[initialIdx] = mesh;
        }
        this.emptyIndex = 15;
        this.grid[15] = null;
      }

      shuffleBoard(movesCount) {
        let lastMovedIdx = -1;
        for (let i = 0; i < movesCount; i++) {
          const validNeighbors = this.getValidNeighbors(this.emptyIndex).filter(idx => idx !== lastMovedIdx);
          if (validNeighbors.length === 0) continue;
          const chosenIdx = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
          this.swapTile(chosenIdx, true);
          lastMovedIdx = this.emptyIndex;
        }
      }

      getValidNeighbors(emptyIdx) {
        const row = Math.floor(emptyIdx / 4);
        const col = emptyIdx % 4;
        const neighbors = [];
        if (row > 0) neighbors.push(emptyIdx - 4);
        if (row < 3) neighbors.push(emptyIdx + 4);
        if (col > 0) neighbors.push(emptyIdx - 1);
        if (col < 3) neighbors.push(emptyIdx + 1);
        return neighbors;
      }

      swapTile(tileGridIdx, instant = false) {
        const tile = this.grid[tileGridIdx];
        if (!tile) return;

        const newPos = this.getPosForGridIndex(this.emptyIndex);
        this.grid[this.emptyIndex] = tile;
        this.grid[tileGridIdx] = null;

        tile.userData.gridIdx = this.emptyIndex;
        this.emptyIndex = tileGridIdx;

        if (instant) {
          tile.position.copy(newPos);
          tile.userData.targetPos.copy(newPos);
        } else {
          tile.userData.targetPos.copy(newPos);
        }
      }

      getTargetObjects() {
        return this.tiles;
      }

      onHit(hitObject) {
        if (this.isGameOver) return { points: 0, combo: 1 };
        const tile = this.tiles.find(t => t === hitObject);
        if (!tile) return { points: 0, combo: 1 };

        const currentIdx = tile.userData.gridIdx;
        const neighbors = this.getValidNeighbors(this.emptyIndex);

        if (neighbors.includes(currentIdx)) {
          this.swapTile(currentIdx, false);

          if (this.checkWin()) {
            // Calcolo del bonus proporzionale al tempo rimanente (100 punti al secondo)
            const timeBonus = Math.floor(Math.max(0, this.timeRemaining)) * 100;
            const totalPoints = 1000 + timeBonus;

            createFloatingText(`SOLVED! +${totalPoints}`, new THREE.Vector3(0, 1.4, -2.0));
            playComboSound(5);
            setTimeout(() => {
              if (gameState === 'PLAYING' && !this.isGameOver) {
                this.shuffleBoard(14);
              }
            }, 1000);
            return { points: totalPoints, combo: 1 };
          }
          return { points: 50, combo: 1 };
        }
        return { points: 0, combo: 1 };
      }

      checkWin() {
        for (let i = 0; i < 15; i++) {
          if (!this.grid[i] || this.grid[i].userData.number !== i + 1) {
            return false;
          }
        }
        return true;
      }

      update(delta) {
        if (this.isGameOver) return;

        this.timeRemaining -= delta;
        const currentSec = Math.ceil(this.timeRemaining);

        if (currentSec < this.lastSecondBeep && currentSec >= 0) {
          this.lastSecondBeep = currentSec;
          playBeepSound(currentSec <= 5);
          updateTimerDisplay(this.timeRemaining);
        }

        if (this.timeRemaining <= 0 && !this.isGameOver) {
          this.isGameOver = true;
          updateTimerDisplay(0);
          playBellSound();
          this.tiles.forEach(t => t.visible = false);

          setTimeout(() => {
            stopCurrentGame();
          }, 2000);
          return;
        }

        this.tiles.forEach(t => {
          if (t.position.distanceTo(t.userData.targetPos) > 0.001) {
            t.position.lerp(t.userData.targetPos, delta * 15);
          } else {
            t.position.copy(t.userData.targetPos);
          }
        });
      }

      cleanup() {
        this.tiles.forEach(t => {
          this.scene.remove(t);
          t.geometry.dispose();
          if (t.material.map) t.material.map.dispose();
          t.material.dispose();
        });
        this.tiles = [];
        this.grid = new Array(16).fill(null);
      }
    }

    init();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c0f1d);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.2, 0.5);
      camera.lookAt(0, 1.0, -2.0);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const floorGeo = new THREE.PlaneGeometry(10, 10, 20, 20);
      floorGeo.rotateX(-Math.PI / 2);
      const floorMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.7 });
      floorWireframe = new THREE.Mesh(floorGeo, floorMat);
      floorWireframe.position.y = 0;
      scene.add(floorWireframe);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      renderer.xr.addEventListener('sessionstart', async () => {
        const session = renderer.xr.getSession();
        try {
          const refSpace = await session.requestReferenceSpace('local-floor');
          renderer.xr.setReferenceSpace(refSpace);
        } catch (e) {
          console.warn("'local-floor' space unavailable, fallback to 'local'.", e);
        }

        if (session.mode === 'immersive-ar') {
          scene.background = null;
        } else {
          scene.background = new THREE.Color(0x0c0f1d);
        }
      });

      renderer.xr.addEventListener('sessionend', () => {
        scene.background = new THREE.Color(0x0c0f1d);
      });

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.0, -2.0);
      controls.update();

      const xrContainer = document.createElement('div');
      xrContainer.id = 'xr-button-container';
      document.body.appendChild(xrContainer);

      const vrButton = VRButton.createButton(renderer);
      const arButton = ARButton.createButton(renderer, { requiredFeatures: ['local-floor'] });

      xrContainer.appendChild(vrButton);
      xrContainer.appendChild(arButton);

      setupControllers();
      create3DHUD();
      createPresentationLogo();
      create3DTimerDisplay();
      updateGunRotation();

      miniGameList = [MiniGame1, MiniGame2, MiniGame3];
      currentMiniGameIndex = 0;
      gameState = 'LOBBY';
      updateHudTexture();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', initAudio, { once: true });
      window.addEventListener('pointerdown', onDesktopShoot);

      renderer.setAnimationLoop(animate);
    }

    function startSelectedGame() {
      if (activeMiniGame) activeMiniGame.cleanup();
      gameState = 'PLAYING';
      score = 0;
      if (logoMesh) logoMesh.visible = false;
      if (timerMesh) timerMesh.visible = true;

      activeMiniGame = new miniGameList[currentMiniGameIndex](scene);
      activeMiniGame.init();
      updateHudTexture();
      update3DButtonText(btnStartMesh, "⏹ STOP GAME", "#ff2a6d");
    }

    function stopCurrentGame() {
      if (activeMiniGame) { activeMiniGame.cleanup(); activeMiniGame = null; }
      gameState = 'LOBBY';
      if (logoMesh) logoMesh.visible = true;
      if (timerMesh) timerMesh.visible = false;

      updateHudTexture();
      update3DButtonText(btnStartMesh, "▶ START GAME", "#00ffcc");
    }

    function switchNextMiniGame() {
      currentMiniGameIndex = (currentMiniGameIndex + 1) % miniGameList.length;
      if (gameState === 'PLAYING') startSelectedGame();
      else updateHudTexture();
    }

    function create3DTimerDisplay() {
      timerCanvas = document.createElement('canvas');
      timerCanvas.width = 256;
      timerCanvas.height = 128;
      timerCtx = timerCanvas.getContext('2d');
      timerTexture = new THREE.CanvasTexture(timerCanvas);

      const geo = new THREE.PlaneGeometry(0.8, 0.4);
      const mat = new THREE.MeshBasicMaterial({ map: timerTexture, transparent: true, side: THREE.DoubleSide });
      timerMesh = new THREE.Mesh(geo, mat);
      timerMesh.position.set(0, 2.0, -2.2);
      timerMesh.visible = false;
      scene.add(timerMesh);
    }

    function updateTimerDisplay(secondsLeft) {
      if (!timerCtx) return;
      const secInt = Math.max(0, Math.ceil(secondsLeft));
      const colorHex = secInt <= 5 ? '#ff0000' : '#ffff00';

      timerCtx.clearRect(0, 0, 256, 128);
      timerCtx.fillStyle = colorHex;
      timerCtx.font = 'bold 84px Arial';
      timerCtx.textAlign = 'center';
      timerCtx.textBaseline = 'middle';
      timerCtx.fillText(secInt.toString(), 128, 64);

      timerTexture.needsUpdate = true;
    }

    function createFloatingText(text, position) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffea00';
      ctx.font = 'bold 30px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 5;
      ctx.strokeText(text, 128, 64);
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 1.0,
        side: THREE.DoubleSide
      });

      const geo = new THREE.PlaneGeometry(0.4, 0.2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);

      mesh.userData = { life: 0.8, initialLife: 0.8 };
      scene.add(mesh);
      floatingTexts.push(mesh);
    }

    function updateFloatingTexts(delta) {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.userData.life -= delta;

        if (ft.userData.life <= 0) {
          scene.remove(ft);
          ft.geometry.dispose();
          ft.material.map.dispose();
          ft.material.dispose();
          floatingTexts.splice(i, 1);
        } else {
          ft.position.y += 0.5 * delta;
          ft.material.opacity = ft.userData.life / ft.userData.initialLife;
        }
      }
    }

    // LOGO NELLA LOBBY: AVVICINATO (z = -1.6) E ALTEZZA 1.2 METRI
    function createPresentationLogo() {
      const logoGeo = new THREE.PlaneGeometry(1, 1);
      const logoMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.05, side: THREE.DoubleSide });
      logoMesh = new THREE.Mesh(logoGeo, logoMat);
      logoMesh.position.set(0, 1.45, -1.6); // Avvicinato da -2.0 a -1.6
      logoMesh.visible = (gameState === 'LOBBY');
      scene.add(logoMesh);

      const textureLoader = new THREE.TextureLoader();
      textureLoader.load('logo.png', (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        logoMat.map = texture;
        const aspectRatio = texture.image.width / texture.image.height;
        const targetHeight = 1.2; // Altezza impostata a 1.2 metri
        logoMesh.scale.set(targetHeight * aspectRatio, targetHeight, 1);
        logoMat.needsUpdate = true;
      }, undefined, () => {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(10, 15, 30, 0.85)'; ctx.fillRect(10, 10, 492, 236);
        ctx.strokeStyle = '#ff2a6d'; ctx.lineWidth = 6; ctx.strokeRect(10, 10, 492, 236);
        ctx.fillStyle = '#ff2a6d'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center'; ctx.fillText('BANG BANG', 256, 110);
        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 42px Arial'; ctx.fillText('BONANZA', 256, 175);
        logoMat.map = new THREE.CanvasTexture(canvas);
        logoMesh.scale.set(2.4, 1.2, 1); // Fallback scala 1.2m
        logoMat.needsUpdate = true;
      });
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playComboSound(comboMultiplier) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const baseFreq = 523.25 * Math.min(1 + (comboMultiplier * 0.15), 2.0);
      const notes = [baseFreq, baseFreq * 1.25, baseFreq * 1.5];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const startTime = now + idx * 0.04;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.35, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.12);
      });
    }

    function playBellSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const duration = 1.0;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(1320, now);
      osc2.frequency.setValueAtTime(1328, now);

      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc1.connect(gain); osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now); osc2.start(now);
      osc1.stop(now + duration); osc2.stop(now + duration);
    }

    function playBeepSound(isUrgent = false) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(isUrgent ? 880 : 440, now);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.08);
    }

    function playGunshotSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const duration = 0.35;

      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2800, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + duration);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(130, now);
      subOsc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
      subGain.gain.setValueAtTime(0.8, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      subOsc.connect(subGain); subGain.connect(audioCtx.destination);
      subOsc.start(now); subOsc.stop(now + 0.18);

      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start(now);
    }

    function playPopSound(isNegative = false, isTargetExplosion = false) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      if (isNegative) {
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);
      } else {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.08);
      }
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);

      if (isTargetExplosion) {
        const burstDuration = 0.12;
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * burstDuration, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900, now);
        filter.Q.setValueAtTime(1.2, now);

        const burstGain = audioCtx.createGain();
        burstGain.gain.setValueAtTime(0.85, now);
        burstGain.gain.exponentialRampToValueAtTime(0.01, now + burstDuration);

        noise.connect(filter); filter.connect(burstGain); burstGain.connect(audioCtx.destination);
        noise.start(now);
      }
    }

    function playDullSound(duration = 1.0) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(90, now);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(180, now);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.05);
      gain.gain.setValueAtTime(0.35, now + duration - 0.05);
      gain.gain.linearRampToValueAtTime(0.001, now + duration);

      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + duration);
    }

    function createExplosion(position, colorHex) {
      const count = 30;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const velocities = [];

      for (let i = 0; i < count; i++) {
        positions[i * 3] = position.x;
        positions[i * 3 + 1] = position.y;
        positions[i * 3 + 2] = position.z;

        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2
        ).normalize().multiplyScalar(1.2 + Math.random() * 2.0);

        velocities.push(dir);
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: colorHex,
        size: 0.04,
        transparent: true,
        opacity: 1.0
      });

      const pSystem = new THREE.Points(geo, mat);
      pSystem.userData = { velocities: velocities, life: 0.4 };
      scene.add(pSystem);
      explosions.push(pSystem);
    }

    function updateExplosions(delta) {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.userData.life -= delta;

        if (exp.userData.life <= 0) {
          scene.remove(exp);
          exp.geometry.dispose();
          exp.material.dispose();
          explosions.splice(i, 1);
        } else {
          const posAttr = exp.geometry.attributes.position;
          const posArray = posAttr.array;
          const vels = exp.userData.velocities;

          for (let j = 0; j < vels.length; j++) {
            posArray[j * 3] += vels[j].x * delta;
            posArray[j * 3 + 1] += vels[j].y * delta;
            posArray[j * 3 + 2] += vels[j].z * delta;
          }
          posAttr.needsUpdate = true;
          exp.material.opacity = exp.userData.life / 0.4;
        }
      }
    }

    function create3DHUD() {
      const hudGroup = new THREE.Group();
      hudGroup.position.set(-1.25, 1.05, -1.5);
      hudGroup.rotation.y = THREE.MathUtils.degToRad(32);

      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 512; hudCanvas.height = 340;
      hudCtx = hudCanvas.getContext('2d');
      hudTexture = new THREE.CanvasTexture(hudCanvas);
      updateHudTexture();

      const panelGeo = new THREE.PlaneGeometry(0.85, 0.58);
      const panelMat = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
      hudGroup.add(new THREE.Mesh(panelGeo, panelMat));

      btnPitchDownMesh = create3DButton("Pitch Down ⤵", 0.24, 0.09);
      btnPitchDownMesh.position.set(-0.28, -0.38, 0);
      btnPitchDownMesh.userData = { action: 'pitch_down' };
      hudGroup.add(btnPitchDownMesh); hudButtons.push(btnPitchDownMesh);

      btnPitchUpMesh = create3DButton("Pitch Up ⤴", 0.24, 0.09);
      btnPitchUpMesh.position.set(-0.02, -0.38, 0);
      btnPitchUpMesh.userData = { action: 'pitch_up' };
      hudGroup.add(btnPitchUpMesh); hudButtons.push(btnPitchUpMesh);

      btnLaserToggleMesh = create3DButton("Laser: ON", 0.24, 0.09);
      btnLaserToggleMesh.position.set(0.24, -0.38, 0);
      btnLaserToggleMesh.userData = { action: 'toggle_laser' };
      hudGroup.add(btnLaserToggleMesh); hudButtons.push(btnLaserToggleMesh);

      btnGameSelectMesh = create3DButton("Select Game 🔄", 0.38, 0.09);
      btnGameSelectMesh.position.set(-0.21, -0.50, 0);
      btnGameSelectMesh.userData = { action: 'select_game' };
      hudGroup.add(btnGameSelectMesh); hudButtons.push(btnGameSelectMesh);

      btnStartMesh = create3DButton("▶ START GAME", 0.38, 0.09, "#00ffcc");
      btnStartMesh.position.set(0.18, -0.50, 0);
      btnStartMesh.userData = { action: 'toggle_start' };
      hudGroup.add(btnStartMesh); hudButtons.push(btnStartMesh);

      scene.add(hudGroup);
    }

    function updateHudTexture() {
      hudCtx.fillStyle = '#0a0f1e'; hudCtx.fillRect(0, 0, 512, 340);
      hudCtx.strokeStyle = '#00ffcc'; hudCtx.lineWidth = 8; hudCtx.strokeRect(4, 4, 504, 332);
      hudCtx.fillStyle = '#ff2a6d'; hudCtx.font = 'bold 26px Arial'; hudCtx.fillText('BANG BANG BONANZA', 28, 45);
      hudCtx.fillStyle = '#ffffff'; hudCtx.font = 'bold 18px Arial'; hudCtx.fillText('Version: v4.1.0 (Timer Bonus & Big Logo)', 28, 80);
      hudCtx.fillStyle = gameState === 'PLAYING' ? '#00ffcc' : '#ffb703'; hudCtx.font = 'bold 20px Arial';
      hudCtx.fillText('Status: ' + (gameState === 'PLAYING' ? 'IN GAME' : 'LOBBY'), 28, 115);
      
      const currentGameInst = miniGameList[currentMiniGameIndex] ? new miniGameList[currentMiniGameIndex](scene) : null;
      const selectedName = currentGameInst ? currentGameInst.name : 'Unknown';
      const gameIndexLabel = `Game #${currentMiniGameIndex + 1}`;
      hudCtx.fillStyle = '#00ffcc'; hudCtx.font = 'bold 22px Arial'; 
      hudCtx.fillText(`${gameIndexLabel}: ${selectedName}`, 28, 155);

      hudCtx.fillStyle = score >= 0 ? '#00ffcc' : '#ff2a6d'; hudCtx.font = 'bold 32px Arial'; 
      hudCtx.fillText('Score: ' + score, 28, 220);

      hudCtx.fillStyle = '#ffb703'; hudCtx.font = 'bold 22px Arial';
      hudCtx.fillText('Pitch: ' + Math.round(THREE.MathUtils.radToDeg(currentGunPitch)) + '°', 28, 275);

      hudTexture.needsUpdate = true;
    }

    function create3DButton(label, width, height, strokeColor = '#00ffcc') {
      const btnCanvas = document.createElement('canvas');
      btnCanvas.width = 300; btnCanvas.height = 100;
      const ctx = btnCanvas.getContext('2d');
      ctx.fillStyle = '#0d222a'; ctx.fillRect(0, 0, 300, 100);
      ctx.strokeStyle = strokeColor; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 292, 92);
      ctx.fillStyle = strokeColor; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, 150, 50);

      const btnTex = new THREE.CanvasTexture(btnCanvas);
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.04), new THREE.MeshStandardMaterial({ map: btnTex, roughness: 0.3 }));
      mesh.userData = { canvas: btnCanvas, ctx: ctx, texture: btnTex };
      return mesh;
    }

    function update3DButtonText(btnMesh, label, colorHex = '#00ffcc') {
      const ctx = btnMesh.userData.ctx;
      ctx.fillStyle = '#0d222a'; ctx.fillRect(0, 0, 300, 100);
      ctx.strokeStyle = colorHex; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 292, 92);
      ctx.fillStyle = colorHex; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, 150, 50);
      btnMesh.userData.texture.needsUpdate = true;
    }

    function createRedGunModel() {
      const gunGroup = new THREE.Group();
      const redGunMat = new THREE.MeshStandardMaterial({ color: 0xe60000, roughness: 0.2, metalness: 0.5 });
      const blackDetailMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });

      const barrelGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.26, 16);
      barrelGeo.rotateX(Math.PI / 2);
      const barrel = new THREE.Mesh(barrelGeo, redGunMat);
      barrel.position.set(0, 0, -0.1);
      gunGroup.add(barrel);

      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.12, 0.04), blackDetailMat);
      handle.position.set(0, -0.05, 0.02); handle.rotation.x = -0.3;
      gunGroup.add(handle);

      const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(0.015, 0.003, 8, 24), blackDetailMat);
      ringMesh.position.set(0, 0.032, 0.02);
      gunGroup.add(ringMesh);

      const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.012, 0.004), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
      frontSight.position.set(0, 0.026, -0.22);
      gunGroup.add(frontSight);

      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -0.23), new THREE.Vector3(0, 0, -15)]);
      const laserLine = new THREE.Line(laserGeo, new THREE.LineBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.6 }));
      laserLine.visible = laserEnabled;
      gunGroup.add(laserLine);
      laserLines.push(laserLine);

      return gunGroup;
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        const pivot = new THREE.Group();
        pivot.add(createRedGunModel());
        controller.add(pivot);
        controller.addEventListener('selectstart', onXRShoot);
        scene.add(controller);
        controllers.push(controller);
        gunPivots.push(pivot);
      }
    }

    function updateGunRotation() {
      gunPivots.forEach(pivot => { pivot.rotation.x = currentGunPitch; });
      updateHudTexture();
    }

    function toggleLaser() {
      laserEnabled = !laserEnabled;
      laserLines.forEach(line => line.visible = laserEnabled);
      update3DButtonText(btnLaserToggleMesh, laserEnabled ? "Laser: ON" : "Laser: OFF");
    }

    function onXRShoot(event) {
      const controller = event.target;
      const pivot = controller.children.find(c => gunPivots.includes(c));
      if (!pivot) return;
      const origin = new THREE.Vector3(), worldQuat = new THREE.Quaternion();
      pivot.getWorldPosition(origin);
      pivot.getWorldQuaternion(worldQuat);
      processShot(origin, new THREE.Vector3(0, 0, -1).applyQuaternion(worldQuat));
    }

    function onDesktopShoot(event) {
      if (renderer.xr.isPresenting) return;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(mouse, camera);
      processShot(raycaster.ray.origin, raycaster.ray.direction);
    }

    function processShot(origin, direction) {
      playGunshotSound();
      const raycaster = new THREE.Raycaster(origin, direction);
      const gameTargets = (activeMiniGame && gameState === 'PLAYING') ? activeMiniGame.getTargetObjects() : [];
      const intersects = raycaster.intersectObjects([...gameTargets, ...hudButtons], false);
      let endPoint = origin.clone().add(direction.clone().multiplyScalar(25));

      if (intersects.length > 0) {
        const hit = intersects[0];
        endPoint = hit.point;
        const hitBtn = hudButtons.find(b => b === hit.object);

        if (hitBtn) {
          playPopSound(false, false);
          if (hitBtn.userData.action === 'pitch_down') { currentGunPitch += THREE.MathUtils.degToRad(1); updateGunRotation(); }
          else if (hitBtn.userData.action === 'pitch_up') { currentGunPitch -= THREE.MathUtils.degToRad(1); updateGunRotation(); }
          else if (hitBtn.userData.action === 'toggle_laser') { toggleLaser(); }
          else if (hitBtn.userData.action === 'select_game') { switchNextMiniGame(); }
          else if (hitBtn.userData.action === 'toggle_start') { if (gameState === 'LOBBY') startSelectedGame(); else stopCurrentGame(); }
        } else if (activeMiniGame && gameState === 'PLAYING') {
          const hitColorHex = hit.object.material.color ? hit.object.material.color.getHex() : 0x00ffcc;
          const hitResult = activeMiniGame.onHit(hit.object);

          if (hitResult.points !== 0) {
            playPopSound(hitResult.points < 0, true);
            createExplosion(hit.point, hitColorHex);

            if (hitResult.combo > 1) {
              createFloatingText("Combo X" + hitResult.combo, hit.point.clone());
              playComboSound(hitResult.combo);
            }

            score += hitResult.points;
            updateHudTexture();
          }
        }
      }
      createTracer(origin, endPoint);
    }

    function createTracer(start, end) {
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([start, end]),
        new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 1.0 })
      );
      line.userData = { life: 0.06 };
      scene.add(line);
      tracers.push(line);
    }

    function updateTracers(delta) {
      for (let i = tracers.length - 1; i >= 0; i--) {
        const tracer = tracers[i];
        tracer.userData.life -= delta;
        if (tracer.userData.life <= 0) {
          scene.remove(tracer); tracer.geometry.dispose(); tracer.material.dispose();
          tracers.splice(i, 1);
        } else {
          tracer.material.opacity = tracer.userData.life / 0.06;
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();
      if (activeMiniGame && gameState === 'PLAYING') activeMiniGame.update(delta);
      updateTracers(delta);
      updateExplosions(delta);
      updateFloatingTexts(delta);
      renderer.render(scene, camera);
    }
  </script>
