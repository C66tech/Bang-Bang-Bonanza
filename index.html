<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Bang Bang Bonanza - WebXR Target Shooter</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
    #xr-button-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 1000; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ... [Struttura base identica alla v5.3.0] ...
    // Ho modificato solo la classe MiniGame3 per il rimescolamento
    
    class MiniGame3 {
      constructor(sceneRef) {
        this.sceneRef = sceneRef;
        this.name = "Grid Slider 15";
        this.duration = 60;
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.isWon = false;
        this.grid = new Array(16).fill(null);
        this.emptyIndex = 15;
        this.tiles = [];
      }

      init() {
        this.cleanup();
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.isWon = false;
        updateTimerDisplay(this.timeRemaining);

        this.createBoard();
        // Ritorno al metodo di rimescolamento logico con 25 mosse
        this.shuffleBoard(25); 
      }

      createBoard() {
        const geo = new THREE.BoxGeometry(0.28, 0.28, 0.04);
        for (let num = 1; num <= 15; num++) {
          const isEven = (num % 2 === 0);
          const bgColor = isEven ? '#ffff00' : '#ff0000';
          const textColor = isEven ? '#000000' : '#ffffff';

          const canvas = document.createElement('canvas');
          canvas.width = 128; canvas.height = 128;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 128, 128);
          ctx.strokeStyle = '#111111'; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 120, 120);
          ctx.fillStyle = textColor; ctx.font = 'bold 54px Arial';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(num.toString(), 64, 64);

          const tex = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.3 });
          const mesh = new THREE.Mesh(geo, mat);

          const initialIdx = num - 1;
          const pos = this.getPosForGridIndex(initialIdx);
          mesh.position.copy(pos);
          mesh.userData = { number: num, gridIdx: initialIdx, targetPos: pos.clone() };

          this.sceneRef.add(mesh);
          this.tiles.push(mesh);
          this.grid[initialIdx] = mesh;
        }
        this.emptyIndex = 15;
        this.grid[15] = null;
      }

      shuffleBoard(movesCount) {
        let lastMovedIdx = -1;
        for (let i = 0; i < movesCount; i++) {
          const validNeighbors = this.getValidNeighbors(this.emptyIndex).filter(idx => idx !== lastMovedIdx);
          if (validNeighbors.length === 0) continue;
          const chosenIdx = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
          this.swapTile(chosenIdx, true);
          lastMovedIdx = this.emptyIndex;
        }
      }

      // ... [Il resto dei metodi rimane invariato come nella v5.3.0] ...
      
      getPosForGridIndex(idx) {
        const row = Math.floor(idx / 4);
        const col = idx % 4;
        const spacingX = 0.32;
        const spacingY = 0.32;
        const startX = -1.5 * spacingX;
        const startY = 1.35;
        return new THREE.Vector3(startX + col * spacingX, startY - row * spacingY, -2.2);
      }

      getValidNeighbors(emptyIdx) {
        const row = Math.floor(emptyIdx / 4);
        const col = emptyIdx % 4;
        const neighbors = [];
        if (row > 0) neighbors.push(emptyIdx - 4);
        if (row < 3) neighbors.push(emptyIdx + 4);
        if (col > 0) neighbors.push(emptyIdx - 1);
        if (col < 3) neighbors.push(emptyIdx + 1);
        return neighbors;
      }

      swapTile(tileGridIdx, instant = false) {
        const tile = this.grid[tileGridIdx];
        if (!tile) return;
        const newPos = this.getPosForGridIndex(this.emptyIndex);
        this.grid[this.emptyIndex] = tile;
        this.grid[tileGridIdx] = null;
        tile.userData.gridIdx = this.emptyIndex;
        this.emptyIndex = tileGridIdx;
        if (instant) {
          tile.position.copy(newPos);
          tile.userData.targetPos.copy(newPos);
        } else {
          tile.userData.targetPos.copy(newPos);
        }
      }

      getTargetObjects() { return this.tiles; }

      onHit(hitObject) {
        if (this.isGameOver || this.isWon) return { points: 0, combo: 1 };
        const tile = this.tiles.find(t => t === hitObject);
        if (!tile) return { points: 0, combo: 1 };
        const currentIdx = tile.userData.gridIdx;
        const neighbors = this.getValidNeighbors(this.emptyIndex);
        if (neighbors.includes(currentIdx)) {
          this.swapTile(currentIdx, false);
          if (this.checkWin()) {
            this.isWon = true;
            const secondsLeft = Math.floor(Math.max(0, this.timeRemaining));
            const timeBonus = secondsLeft * 100;
            const totalPoints = 1000 + timeBonus;
            createFloatingText(`TIME BONUS: +${timeBonus}`, new THREE.Vector3(0, 1.4, -2.0));
            playComboSound(5);
            setTimeout(() => { if (gameState === 'PLAYING') stopCurrentGame(); }, 3000);
            return { points: totalPoints, combo: 1 };
          }
          return { points: 50, combo: 1 };
        }
        return { points: 0, combo: 1 };
      }

      checkWin() {
        for (let i = 0; i < 15; i++) {
          if (!this.grid[i] || this.grid[i].userData.number !== i + 1) return false;
        }
        return true;
      }

      update(delta) {
        this.tiles.forEach(t => {
          if (t.position.distanceTo(t.userData.targetPos) > 0.001) t.position.lerp(t.userData.targetPos, delta * 15);
          else t.position.copy(t.userData.targetPos);
        });
        if (this.isGameOver || this.isWon) return;
        this.timeRemaining -= delta;
        const currentSec = Math.ceil(this.timeRemaining);
        if (currentSec < this.lastSecondBeep && currentSec >= 0) {
          this.lastSecondBeep = currentSec;
          playBeepSound(currentSec <= 5);
          updateTimerDisplay(this.timeRemaining);
        }
        if (this.timeRemaining <= 0 && !this.isGameOver) {
          this.isGameOver = true;
          updateTimerDisplay(0);
          playBellSound();
          loseLife();
          this.tiles.forEach(t => t.visible = false);
          setTimeout(() => { stopCurrentGame(); }, 2000);
        }
      }

      cleanup() {
        this.tiles.forEach(t => { this.sceneRef.remove(t); t.geometry.dispose(); if(t.material.map) t.material.map.dispose(); t.material.dispose(); });
        this.tiles = []; this.grid = new Array(16).fill(null);
      }
    }
    
    // ... [Il resto del codice resta identico alla v5.3.0] ...
  </script>
</body>
</html>
