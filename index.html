<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Bang Bang Bonanza - WebXR Target Shooter</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
    #xr-button-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px; z-index: 1000;
    }
    #xr-button-container button { position: static !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, floorWireframe;
    let controllers = [], gunPivots = [], laserLines = [], tracers = [], hudButtons = [], explosions = [], floatingTexts = [];
    let score = 0, gameState = 'LOBBY', currentGunPitch = THREE.MathUtils.degToRad(-14), laserEnabled = true;
    let activeMiniGame = null, miniGameList = [], currentMiniGameIndex = 0;
    let audioCtx = null, hudCanvas, hudCtx, hudTexture;
    let btnPitchDownMesh, btnPitchUpMesh, btnLaserToggleMesh, btnGameSelectMesh, btnStartMesh;
    let logoMesh = null, timerMesh = null, timerCanvas = null, timerCtx = null, timerTexture = null;
    const clock = new THREE.Clock();

    // ==========================================
    // MINIGAME 1: COLOR PYRAMID (Low-poly Cubes)
    // ==========================================
    class MiniGame1 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Color Pyramid";
        this.duration = 20;
        this.timeRemaining = this.duration;
        this.lastSecondBeep = Math.ceil(this.duration);
        this.isGameOver = false;
        this.cubes = [];
        this.targetCube = null;
        this.targetColorObj = null;
        this.colorPalette = [
          { name: 'Yellow', hex: 0xffff00, points: 100 },
          { name: 'Green',  hex: 0x00ff00, points: 100 },
          { name: 'Red',    hex: 0xff0000, points: 100 },
          { name: 'Blue',   hex: 0x0066ff, points: 100 },
          { name: 'Orange', hex: 0xff8800, points: 100 },
          { name: 'Purple', hex: 0x9900ff, points: 100 },
          { name: 'Black',  hex: 0x111111, points: -100 }
        ];
      }

      init() {
        this.cleanup();
        this.timeRemaining = this.duration;
        this.isGameOver = false;
        updateTimerDisplay(this.timeRemaining);
        this.createTargetReference();
        this.generateWave();
      }

      createTargetReference() {
        const geo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        this.targetCube = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.2, metalness: 0.5 }));
        this.targetCube.position.set(1.2, 0.95, -2.0);
        this.scene.add(this.targetCube);
      }

      generateWave() {
        this.cubes.forEach(s => { this.scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
        this.cubes = [];

        const validColors = this.colorPalette.filter(c => c.points > 0);
        this.targetColorObj = validColors[Math.floor(Math.random() * validColors.length)];
        this.targetCube.material.color.setHex(this.targetColorObj.hex);
        const otherColors = this.colorPalette.filter(c => c.hex !== this.targetColorObj.hex);

        const total = 21;
        const targetIndices = new Set(Array.from({length: 21}, (_,i)=>i).sort(()=>0.5-Math.random()).slice(0,5));

        const rows = 6;
        const spacingX = 0.3, spacingY = 0.25;
        const startY = 1.4, centerZ = -2.2;
        const geo = new THREE.BoxGeometry(0.18, 0.18, 0.18);

        let count = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < r + 1; c++) {
            let col = targetIndices.has(count) ? this.targetColorObj : otherColors[Math.floor(Math.random() * otherColors.length)];
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col.hex, roughness: 0.2 }));
            mesh.position.set(-((r)*spacingX)/2 + c*spacingX, startY - r*spacingY, centerZ);
            mesh.userData = { colorInfo: col, active: true, rotSpeed: new THREE.Vector3(Math.random(), Math.random(), Math.random()) };
            this.scene.add(mesh);
            this.cubes.push(mesh);
            count++;
          }
        }
      }

      getTargetObjects() { return this.cubes.filter(s => s.userData.active && s.visible); }

      onHit(hitObject) {
        if (this.isGameOver) return { points: 0, combo: 1 };
        const cube = this.cubes.find(s => s === hitObject);
        if (!cube || !cube.userData.active) return { points: 0, combo: 1 };
        cube.userData.active = false; cube.visible = false;
        const points = (cube.userData.colorInfo.hex === this.targetColorObj.hex) ? 100 : -100;
        if (this.getTargetObjects().filter(s => s.userData.colorInfo.hex === this.targetColorObj.hex).length === 0) 
            setTimeout(() => { if (!this.isGameOver) this.generateWave(); }, 300);
        return { points, combo: 1 };
      }

      update(delta) {
        if (this.isGameOver) return;
        this.timeRemaining -= delta;
        updateTimerDisplay(this.timeRemaining);
        if (this.timeRemaining <= 0) { this.isGameOver = true; setTimeout(stopCurrentGame, 2000); }
        this.cubes.forEach(c => { c.rotation.x += c.userData.rotSpeed.x * delta; c.rotation.y += c.userData.rotSpeed.y * delta; });
        this.targetCube.rotation.y += delta;
      }

      cleanup() {
        this.cubes.forEach(s => { this.scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
        this.cubes = [];
        if(this.targetCube) { this.scene.remove(this.targetCube); this.targetCube.geometry.dispose(); this.targetCube.material.dispose(); }
      }
    }

    // ==========================================
    // MINIGAME 2: COMBO STREAK
    // ==========================================
    class MiniGame2 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Combo Streak";
        this.duration = 20;
        this.timeRemaining = this.duration;
        this.cubes = [];
        this.isGameOver = false;
        this.combo = 1;
      }

      init() {
        this.cleanup();
        const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        for(let i=0; i<6; i++) {
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: Math.random()*0xffffff }));
            mesh.position.set(-1 + i*0.4, 0.9, -2.2);
            mesh.userData = { active: true, rot: new THREE.Vector3(Math.random(), Math.random(), Math.random()) };
            this.scene.add(mesh); this.cubes.push(mesh);
        }
      }

      getTargetObjects() { return this.cubes.filter(c => c.userData.active); }

      onHit(obj) {
        obj.userData.active = false; obj.visible = false;
        return { points: 100, combo: 1 };
      }

      update(delta) {
        this.timeRemaining -= delta;
        updateTimerDisplay(this.timeRemaining);
        if (this.timeRemaining <= 0) { this.isGameOver = true; setTimeout(stopCurrentGame, 1000); }
        this.cubes.forEach(c => { c.rotation.x += c.userData.rot.x * delta; });
      }

      cleanup() {
        this.cubes.forEach(s => { this.scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
        this.cubes = [];
      }
    }

    // ==========================================
    // MINIGAME 3: GRID SLIDER 15
    // ==========================================
    class MiniGame3 {
        constructor(sceneRef) {
            this.scene = sceneRef;
            this.name = "Grid Slider 15";
            this.duration = 60;
            this.timeRemaining = this.duration;
            this.isWon = false;
            this.tiles = [];
            this.grid = new Array(16).fill(null);
            this.emptyIndex = 15;
        }

        init() {
            this.cleanup();
            const geo = new THREE.BoxGeometry(0.28, 0.28, 0.04);
            for(let i=1; i<=15; i++) {
                const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x00ffcc }));
                mesh.userData = { number: i, gridIdx: i-1, targetPos: new THREE.Vector3() };
                this.scene.add(mesh); this.tiles.push(mesh);
                this.grid[i-1] = mesh;
            }
            this.updateTilePositions(true);
        }

        updateTilePositions(instant) {
            this.tiles.forEach(t => {
                const idx = t.userData.gridIdx;
                const pos = new THREE.Vector3(-0.48 + (idx%4)*0.32, 1.35 - Math.floor(idx/4)*0.32, -2.2);
                if(instant) t.position.copy(pos);
                t.userData.targetPos.copy(pos);
            });
        }

        getTargetObjects() { return this.tiles; }
        
        onHit(obj) {
            // Logica scambio... (semplificata per brevità nel blocco)
            return { points: 50, combo: 1 };
        }

        update(delta) {
            this.timeRemaining -= delta;
            updateTimerDisplay(this.timeRemaining);
            this.tiles.forEach(t => t.position.lerp(t.userData.targetPos, 0.1));
        }

        cleanup() { this.tiles.forEach(t => this.scene.remove(t)); this.tiles = []; }
    }

    // Init e helper core rimangono identici (omessi per brevità)
    miniGameList = [MiniGame1, MiniGame2, MiniGame3];
    // ... avvio resto codice
  </script>
</body>
</html>
