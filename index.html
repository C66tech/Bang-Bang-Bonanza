<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- TAG META ANTI-CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>WebXR Red Gun Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
  </style>

  <!-- Import Map Three.js via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let scene, camera, renderer;
    let controllers = [];
    let gunPivots = [];
    let bullets = [];
    let targets = [];
    let hudButtons = [];
    let score = 0;
    let currentGunPitch = 0;
    
    // Elementi HUD 3D
    let hudCanvas, hudCtx, hudTexture;
    let btnPitchDownMesh, btnPitchUpMesh;

    const clock = new THREE.Clock();

    init();

    function init() {
      // 1. Scena 3D
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101020);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      // 3. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 4. Renderer WebGL + WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 5. Bottoni di ingresso VR e AR
      document.body.appendChild(VRButton.createButton(renderer));
      document.body.appendChild(ARButton.createButton(renderer));

      // 6. Setup Controller e Pistola
      setupControllers();

      // 7. Setup HUD 3D Nello Spazio VR
      create3DHUD();

      // 8. Spawna bersagli vicino al pavimento
      for (let i = 0; i < 8; i++) {
        spawnTarget();
      }

      window.addEventListener('resize', onWindowResize);

      // Render Loop per WebXR
      renderer.setAnimationLoop(animate);
    }

    // CREAZIONE HUD 3D SPAZIALE IN VR
    function create3DHUD() {
      const hudGroup = new THREE.Group();
      // Posizionato a sinistra del giocatore, all'altezza degli occhi
      hudGroup.position.set(-1.2, 1.3, -1.8);
      hudGroup.rotation.y = THREE.MathUtils.degToRad(25); // Orientato verso il giocatore

      // Canvas 2D per il testo
      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 512;
      hudCanvas.height = 256;
      hudCtx = hudCanvas.getContext('2d');

      hudTexture = new THREE.CanvasTexture(hudCanvas);
      updateHudTexture();

      // Pannello Display Principale
      const panelGeo = new THREE.PlaneGeometry(1.0, 0.5);
      const panelMat = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
      const panelMesh = new THREE.Mesh(panelGeo, panelMat);
      hudGroup.add(panelMesh);

      // --- PULSANTI 3D INTERATTIVI (SPARABILI) ---
      // Pulsante 1: Inclina Avanti
      btnPitchDownMesh = create3DButton("Inclina Avanti ⤵", 0x00ffcc);
      btnPitchDownMesh.position.set(-0.28, -0.38, 0);
      btnPitchDownMesh.userData = { action: 'pitch_down' };
      hudGroup.add(btnPitchDownMesh);
      hudButtons.push(btnPitchDownMesh);

      // Pulsante 2: Inclina Indietro
      btnPitchUpMesh = create3DButton("Inclina Indietro ⤴", 0x00ffcc);
      btnPitchUpMesh.position.set(0.28, -0.38, 0);
      btnPitchUpMesh.userData = { action: 'pitch_up' };
      hudGroup.add(btnPitchUpMesh);
      hudButtons.push(btnPitchUpMesh);

      scene.add(hudGroup);
    }

    // Helper per generare la texture dinamica del testo HUD
    function updateHudTexture() {
      hudCtx.fillStyle = '#0a0f1e';
      hudCtx.fillRect(0, 0, 512, 256);

      // Bordo
      hudCtx.strokeStyle = '#00ffcc';
      hudCtx.lineWidth = 8;
      hudCtx.strokeRect(4, 4, 504, 248);

      // Testi
      hudCtx.fillStyle = '#88ffeb';
      hudCtx.font = 'bold 22px Arial';
      hudCtx.fillText('WEBXR SHOOTER', 30, 45);

      hudCtx.fillStyle = '#ffffff';
      hudCtx.font = 'bold 26px Arial';
      hudCtx.fillText('Versione: v1.4.0', 30, 95);

      hudCtx.fillStyle = '#00ffcc';
      hudCtx.font = 'bold 36px Arial';
      hudCtx.fillText('Punti: ' + score, 30, 175);

      hudTexture.needsUpdate = true;
    }

    // Genera pulsanti 3D con label testuale integrata
    function create3DButton(label, colorHex) {
      const btnCanvas = document.createElement('canvas');
      btnCanvas.width = 256;
      btnCanvas.height = 80;
      const ctx = btnCanvas.getContext('2d');

      ctx.fillStyle = '#0d222a';
      ctx.fillRect(0, 0, 256, 80);
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, 250, 74);

      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 40);

      const btnTex = new THREE.CanvasTexture(btnCanvas);
      const geo = new THREE.BoxGeometry(0.5, 0.16, 0.04);
      const mat = new THREE.MeshStandardMaterial({ map: btnTex, roughness: 0.3 });

      return new THREE.Mesh(geo, mat);
    }

    // Modello Pistola Rossa
    function createRedGunModel() {
      const gunGroup = new THREE.Group();

      const redGunMat = new THREE.MeshStandardMaterial({ 
        color: 0xe60000, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const blackDetailMat = new THREE.MeshStandardMaterial({ 
        color: 0x111111, 
        roughness: 0.6 
      });

      // Canna
      const barrelGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.26, 16);
      barrelGeo.rotateX(Math.PI / 2);
      const barrel = new THREE.Mesh(barrelGeo, redGunMat);
      barrel.position.set(0, 0, -0.1);
      gunGroup.add(barrel);

      // Impugnatura
      const handleGeo = new THREE.BoxGeometry(0.03, 0.12, 0.04);
      const handle = new THREE.Mesh(handleGeo, blackDetailMat);
      handle.position.set(0, -0.05, 0.02);
      handle.rotation.x = -0.3;
      gunGroup.add(handle);

      // Mirino Posteriore
      const rearSightGeo = new THREE.BoxGeometry(0.016, 0.012, 0.005);
      const rearSight = new THREE.Mesh(rearSightGeo, blackDetailMat);
      rearSight.position.set(0, 0.025, 0.02);
      gunGroup.add(rearSight);

      // Mirino Anteriore
      const frontSightGeo = new THREE.BoxGeometry(0.006, 0.012, 0.006);
      const frontSightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const frontSight = new THREE.Mesh(frontSightGeo, frontSightMat);
      frontSight.position.set(0, 0.025, -0.22);
      gunGroup.add(frontSight);

      // Laser
      const laserGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.23),
        new THREE.Vector3(0, 0, -15)
      ]);
      const laserMat = new THREE.LineBasicMaterial({ 
        color: 0xff0000, 
        transparent: true, 
        opacity: 0.6 
      });
      const laserLine = new THREE.Line(laserGeo, laserMat);
      gunGroup.add(laserLine);

      return gunGroup;
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);

        const pivot = new THREE.Group();
        const gun = createRedGunModel();
        
        pivot.add(gun);
        controller.add(pivot);

        controller.addEventListener('selectstart', onShoot);

        scene.add(controller);
        controllers.push(controller);
        gunPivots.push(pivot);
      }
    }

    function updateGunRotation() {
      gunPivots.forEach(pivot => {
        pivot.rotation.x = currentGunPitch;
      });
    }

    function onShoot(event) {
      const controller = event.target;

      const bulletGeo = new THREE.SphereGeometry(0.025, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      const pivot = controller.children.find(c => gunPivots.includes(c));
      
      if (pivot) {
        pivot.getWorldPosition(bullet.position);

        const direction = new THREE.Vector3(0, 0, -1);
        const worldQuaternion = new THREE.Quaternion();
        pivot.getWorldQuaternion(worldQuaternion);
        direction.applyQuaternion(worldQuaternion);

        bullet.userData = {
          velocity: direction.multiplyScalar(45), // Velocità alta
          life: 0
        };

        scene.add(bullet);
        bullets.push(bullet);
      }
    }

    function spawnTarget() {
      const geo = new THREE.IcosahedronGeometry(0.18, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.2,
        metalness: 0.7
      });
      const target = new THREE.Mesh(geo, mat);

      target.position.x = (Math.random() - 0.5) * 4;
      target.position.y = 0.15 + Math.random() * 0.3; 
      target.position.z = -1.5 - Math.random() * 3;

      scene.add(target);
      targets.push(target);
    }

    function updateBullets(delta) {
      const step = THREE.MathUtils.degToRad(5);

      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.position.addScaledVector(bullet.userData.velocity, delta);
        bullet.userData.life += delta;

        let bulletDestroyed = false;

        // 1. COLLISIONE CON PULSANTI HUD 3D
        for (let btn of hudButtons) {
          const btnBox = new THREE.Box3().setFromObject(btn);
          if (btnBox.containsPoint(bullet.position)) {
            if (btn.userData.action === 'pitch_down') {
              currentGunPitch += step;
              updateGunRotation();
            } else if (btn.userData.action === 'pitch_up') {
              currentGunPitch -= step;
              updateGunRotation();
            }

            scene.remove(bullet);
            bullets.splice(i, 1);
            bulletDestroyed = true;
            break;
          }
        }

        if (bulletDestroyed) continue;

        // 2. COLLISIONE CON BERSAGLI A TERRA
        for (let j = targets.length - 1; j >= 0; j--) {
          const target = targets[j];
          const dist = bullet.position.distanceTo(target.position);

          if (dist < 0.22) {
            scene.remove(target);
            targets.splice(j, 1);

            scene.remove(bullet);
            bullets.splice(i, 1);

            score += 100;
            updateHudTexture(); // Aggiorna il punteggio nel canvas 3D VR

            spawnTarget();
            bulletDestroyed = true;
            break;
          }
        }

        if (bulletDestroyed) continue;

        // Rimuovi proiettili vecchi
        if (bullet.userData.life > 2.5 && bullets.includes(bullet)) {
          scene.remove(bullet);
          bullets.splice(i, 1);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();

      targets.forEach(t => {
        t.rotation.x += 0.8 * delta;
        t.rotation.y += 1.0 * delta;
      });

      updateBullets(delta);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
