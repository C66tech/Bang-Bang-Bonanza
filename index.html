<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- TAG META ANTI-CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

  <title>Bang Bang Bonanza - WebXR Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;

  <!-- Import Map Three.js via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<body>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let controllers = [];
    let gunPivots = [];
    let laserLines = [];
    let tracers = [];
    let hudButtons = [];
    let score = 0;
    
    // STATO DEL GIOCO: 'LOBBY' oppure 'PLAYING'
    let gameState = 'LOBBY';

    // MODALITÀ ALTEZZA: 'STANDING' (In piedi) oppure 'SEATED' (Seduto)
    let heightMode = 'STANDING';

    // INCLINAZIONE DEFAULT -14°
    let currentGunPitch = THREE.MathUtils.degToRad(-14);
    let laserEnabled = true;
    
    // Gestione Minigiochi
    let activeMiniGame = null;
    let miniGameList = [];
    let currentMiniGameIndex = 0;

    // Web Audio API Context
    let audioCtx = null;

    // Elementi HUD 3D
    let hudGroup, hudCanvas, hudCtx, hudTexture;
    let btnPitchDownMesh, btnPitchUpMesh, btnLaserToggleMesh, btnGameSelectMesh, btnStartMesh, btnHeightModeMesh;

    // Logo Mesh
    let logoMesh = null;

    const clock = new THREE.Clock();

    // ==========================================
    // CLASSE MINIGIOCO 1 (Griglia 3x3 Sfere Colorate)
    // ==========================================
    class MiniGame1 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Minigioco 1";
        this.spheres = [];
        this.colorPalette = [
          { name: 'Giallo', hex: 0xffff00, points: 100 },
          { name: 'Verde',  hex: 0x00ff00, points: 100 },
          { name: 'Rosso',  hex: 0xff0000, points: 100 },
          { name: 'Blu',    hex: 0x0066ff, points: 100 },
          { name: 'Arancio',hex: 0xff8800, points: 100 },
          { name: 'Viola',  hex: 0x9900ff, points: 100 },
          { name: 'Nero',   hex: 0x111111, points: -100 }
        ];
      }

      init(currentHeightMode = 'STANDING') {
        this.cleanup();

        const isSeated = (currentHeightMode === 'SEATED');
        const rows = 3;
        const cols = 3;
        const spacingX = 0.55;
        const spacingY = 0.40;
        const startX = -((cols - 1) * spacingX) / 2;
        const startY = isSeated ? 0.05 : 0.20;
        const centerZ = -2.5;

        const geo = new THREE.SphereGeometry(0.16, 24, 24);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const randomColor = this.getRandomColorObj();
            
            const mat = new THREE.MeshStandardMaterial({
              color: randomColor.hex,
              roughness: 0.2,
              metalness: 0.5
            });

            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set(
              startX + c * spacingX,
              startY + r * spacingY,
              centerZ
            );

            sphere.userData = {
              colorInfo: randomColor,
              active: true,
              baseR: r
            };

            this.scene.add(sphere);
            this.spheres.push(sphere);
          }
        }
      }

      setHeightMode(mode) {
        const isSeated = (mode === 'SEATED');
        const spacingY = 0.40;
        const startY = isSeated ? 0.05 : 0.20;
        this.spheres.forEach(s => {
          s.position.y = startY + s.userData.baseR * spacingY;
        });
      }

      getRandomColorObj() {
        const idx = Math.floor(Math.random() * this.colorPalette.length);
        return this.colorPalette[idx];
      }

      getTargetObjects() {
        return this.spheres.filter(s => s.userData.active && s.visible);
      }

      onHit(hitObject) {
        const sphere = this.spheres.find(s => s === hitObject);
        if (!sphere || !sphere.userData.active || !sphere.visible) return 0;

        const points = sphere.userData.colorInfo.points;

        sphere.userData.active = false;
        sphere.visible = false;

        setTimeout(() => {
          if (this.spheres.includes(sphere) && gameState === 'PLAYING') {
            const newColor = this.getRandomColorObj();
            sphere.userData.colorInfo = newColor;
            sphere.material.color.setHex(newColor.hex);
            sphere.userData.active = true;
            sphere.visible = true;
          }
        }, 2000);

        return points;
      }

      update(delta) {
        this.spheres.forEach(s => {
          if (s.userData.active && s.visible) {
            s.rotation.y += 0.8 * delta;
          }
        });
      }

      cleanup() {
        this.spheres.forEach(s => {
          this.scene.remove(s);
          s.geometry.dispose();
          s.material.dispose();
        });
        this.spheres = [];
      }
    }

    // ==========================================
    // CLASSE MINIGIOCO 2 (5 Sfere 1 Riga + Timer 5s)
    // ==========================================
    class MiniGame2 {
      constructor(sceneRef) {
        this.scene = sceneRef;
        this.name = "Minigioco 2";
        this.spheres = [];
        this.timer = 0;
        this.isWaveActive = true;
        this.colorPalette = [
          { name: 'Giallo', hex: 0xffff00, points: 100 },
          { name: 'Verde',  hex: 0x00ff00, points: 100 },
          { name: 'Rosso',  hex: 0xff0000, points: 100 },
          { name: 'Blu',    hex: 0x0066ff, points: 100 },
          { name: 'Arancio',hex: 0xff8800, points: 100 },
          { name: 'Viola',  hex: 0x9900ff, points: 100 },
          { name: 'Nero',   hex: 0x111111, points: -100 }
        ];
      }

      init(currentHeightMode = 'STANDING') {
        this.cleanup();
        this.timer = 0;
        this.isWaveActive = true;

        const isSeated = (currentHeightMode === 'SEATED');
        const count = 5;
        const spacingX = 0.55;
        const startX = -((count - 1) * spacingX) / 2;
        const posY = isSeated ? 0.15 : 0.30;
        const posZ = -2.5;

        const geo = new THREE.SphereGeometry(0.16, 24, 24);

        for (let i = 0; i < count; i++) {
          const colorObj = this.getRandomColorObj();

          const mat = new THREE.MeshStandardMaterial({
            color: colorObj.hex,
            roughness: 0.2,
            metalness: 0.5
          });

          const sphere = new THREE.Mesh(geo, mat);
          sphere.position.set(startX + i * spacingX, posY, posZ);

          sphere.userData = {
            colorInfo: colorObj,
            active: true
          };

          this.scene.add(sphere);
          this.spheres.push(sphere);
        }
      }

      setHeightMode(mode) {
        const isSeated = (mode === 'SEATED');
        const posY = isSeated ? 0.15 : 0.30;
        this.spheres.forEach(s => {
          s.position.y = posY;
        });
      }

      getRandomColorObj() {
        const idx = Math.floor(Math.random() * this.colorPalette.length);
        return this.colorPalette[idx];
      }

      getTargetObjects() {
        return this.spheres.filter(s => s.userData.active && s.visible);
      }

      onHit(hitObject) {
        const sphere = this.spheres.find(s => s === hitObject);
        if (!sphere || !sphere.userData.active || !sphere.visible) return 0;

        const points = sphere.userData.colorInfo.points;

        sphere.userData.active = false;
        sphere.visible = false;

        return points;
      }

      update(delta) {
        this.timer += delta;

        if (this.isWaveActive && this.timer >= 5.0) {
          this.isWaveActive = false;
          this.spheres.forEach(s => {
            s.userData.active = false;
            s.visible = false;
          });
        } 
        else if (!this.isWaveActive && this.timer >= 6.0) {
          this.timer = 0;
          this.isWaveActive = true;

          this.spheres.forEach(s => {
            const newColor = this.getRandomColorObj();
            s.userData.colorInfo = newColor;
            s.material.color.setHex(newColor.hex);
            s.userData.active = true;
            s.visible = true;
          });
        }

        this.spheres.forEach(s => {
          if (s.visible) {
            s.rotation.y += 0.8 * delta;
          }
        });
      }

      cleanup() {
        this.spheres.forEach(s => {
          this.scene.remove(s);
          s.geometry.dispose();
          s.material.dispose();
        });
        this.spheres = [];
      }
    }

    // ==========================================
    // INIZIALIZZAZIONE APPLICAZIONE WEBXR
    // ==========================================
    init();

    function init() {
      // 1. Scena 3D
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c0f1d);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.3, 0.5);
      camera.lookAt(0, 1.1, -2.5);

      // 3. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 4. Renderer WebGL + WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // TRASPARENZA IN AR PASSTHROUGH
      renderer.xr.addEventListener('sessionstart', () => {
        const session = renderer.xr.getSession();
        if (session.environmentBlendMode === 'additive' || session.environmentBlendMode === 'alpha-blend') {
          scene.background = null;
        }
      });

      renderer.xr.addEventListener('sessionend', () => {
        scene.background = new THREE.Color(0x0c0f1d);
      });

      // Controlli per anteprima Desktop (Mouse)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.1, -2.5);
      controls.update();

      // 5. Bottoni di ingresso VR e AR
      document.body.appendChild(VRButton.createButton(renderer));
      document.body.appendChild(ARButton.createButton(renderer));

      // 6. Setup Controller e Pistole
      setupControllers();

      // 7. Setup HUD 3D
      create3DHUD();

      // 8. Schermata di Presentazione / Logo
      createPresentationLogo();

      // Applicazione inclinazione iniziale (-14°)
      updateGunRotation();

      // 9. Registro Minigiochi
      miniGameList = [MiniGame1, MiniGame2];
      currentMiniGameIndex = 0;

      gameState = 'LOBBY';
      applyHeightMode();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', initAudio, { once: true });
      window.addEventListener('pointerdown', onDesktopShoot);

      // Render Loop per WebXR
      renderer.setAnimationLoop(animate);
    }

    function applyHeightMode() {
      const isSeated = (heightMode === 'SEATED');

      if (hudGroup) {
        hudGroup.position.y = isSeated ? 0.85 : 1.25;
      }

      if (logoMesh) {
        logoMesh.position.y = isSeated ? 1.35 : 1.80;
      }

      if (btnHeightModeMesh) {
        update3DButtonText(
          btnHeightModeMesh, 
          isSeated ? "🪑 Seduto" : "🧍 In piedi", 
          isSeated ? "#ffb703" : "#00ffcc"
        );
      }

      if (activeMiniGame) {
        activeMiniGame.setHeightMode(heightMode);
      }

      updateHudTexture();
    }

    function startSelectedGame() {
      if (activeMiniGame) {
        activeMiniGame.cleanup();
      }
      gameState = 'PLAYING';
      score = 0;
      activeMiniGame = new miniGameList[currentMiniGameIndex](scene);
      activeMiniGame.init(heightMode);
      
      updateHudTexture();
      update3DButtonText(btnStartMesh, "⏹ STOP GIOCO", "#ff2a6d");
    }

    function stopCurrentGame() {
      if (activeMiniGame) {
        activeMiniGame.cleanup();
        activeMiniGame = null;
      }
      gameState = 'LOBBY';
      updateHudTexture();
      update3DButtonText(btnStartMesh, "▶ START GIOCO", "#00ffcc");
    }

    function switchNextMiniGame() {
      currentMiniGameIndex = (currentMiniGameIndex + 1) % miniGameList.length;
      
      if (gameState === 'PLAYING') {
        startSelectedGame();
      } else {
        updateHudTexture();
      }
    }

    function createPresentationLogo() {
      const logoGeo = new THREE.PlaneGeometry(1, 1);
      const logoMat = new THREE.MeshBasicMaterial({
        transparent: true,
        alphaTest: 0.05,
        side: THREE.DoubleSide
      });

      logoMesh = new THREE.Mesh(logoGeo, logoMat);
      logoMesh.position.set(0, 1.80, -2.5);
      scene.add(logoMesh);

      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(
        'logo.png',
        (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          logoMat.map = texture;

          const imgWidth = texture.image.width;
          const imgHeight = texture.image.height;
          const aspectRatio = imgWidth / imgHeight;

          const targetHeight = 0.8;
          logoMesh.scale.set(targetHeight * aspectRatio, targetHeight, 1);
          logoMat.needsUpdate = true;
        },
        undefined,
        () => {
          console.warn("logo.png non trovato. Generazione logo di riserva.");
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = 'rgba(10, 15, 30, 0.85)';
          ctx.fillRect(10, 10, 492, 236);

          ctx.strokeStyle = '#ff2a6d';
          ctx.lineWidth = 6;
          ctx.strokeRect(10, 10, 492, 236);

          ctx.fillStyle = '#ff2a6d';
          ctx.font = 'bold 36px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('BANG BANG', 256, 110);

          ctx.fillStyle = '#00ffcc';
          ctx.font = 'bold 42px Arial';
          ctx.fillText('BONANZA', 256, 175);

          const fallbackTexture = new THREE.CanvasTexture(canvas);
          logoMat.map = fallbackTexture;
          logoMesh.scale.set(1.6, 0.8, 1);
          logoMat.needsUpdate = true;
        }
      );
    }

    // --- SINTETIZZATORE AUDIO WEB AUDIO API ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playGunshotSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1400, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + 0.12);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
    }

    function playPopSound(isNegative = false) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      if (isNegative) {
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
      } else {
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
      }

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    // --- CREAZIONE HUD 3D ---
    function create3DHUD() {
      hudGroup = new THREE.Group();
      hudGroup.position.set(-1.1, 1.25, -1.6);
      hudGroup.rotation.y = THREE.MathUtils.degToRad(22);

      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 512;
      hudCanvas.height = 360;
      hudCtx = hudCanvas.getContext('2d');

      hudTexture = new THREE.CanvasTexture(hudCanvas);
      updateHudTexture();

      const panelGeo = new THREE.PlaneGeometry(1.0, 0.72);
      const panelMat = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
      const panelMesh = new THREE.Mesh(panelGeo, panelMat);
      hudGroup.add(panelMesh);

      // --- PULSANTI 3D SPARABILI ---
      // 1. Inclina Avanti (+1°)
      btnPitchDownMesh = create3DButton("Inclina Avanti ⤵", 0.28, 0.11);
      btnPitchDownMesh.position.set(-0.33, -0.48, 0);
      btnPitchDownMesh.userData = { action: 'pitch_down' };
      hudGroup.add(btnPitchDownMesh);
      hudButtons.push(btnPitchDownMesh);

      // 2. Inclina Indietro (-1°)
      btnPitchUpMesh = create3DButton("Inclina Indietro ⤴", 0.28, 0.11);
      btnPitchUpMesh.position.set(-0.02, -0.48, 0);
      btnPitchUpMesh.userData = { action: 'pitch_up' };
      hudGroup.add(btnPitchUpMesh);
      hudButtons.push(btnPitchUpMesh);

      // 3. Toggle Laser
      btnLaserToggleMesh = create3DButton("Laser: ON", 0.28, 0.11);
      btnLaserToggleMesh.position.set(0.29, -0.48, 0);
      btnLaserToggleMesh.userData = { action: 'toggle_laser' };
      hudGroup.add(btnLaserToggleMesh);
      hudButtons.push(btnLaserToggleMesh);

      // 4. SELETTORE ALTEZZA (IN PIEDI / SEDUTO)
      btnHeightModeMesh = create3DButton("🧍 In piedi", 0.43, 0.11);
      btnHeightModeMesh.position.set(-0.25, -0.62, 0);
      btnHeightModeMesh.userData = { action: 'toggle_height' };
      hudGroup.add(btnHeightModeMesh);
      hudButtons.push(btnHeightModeMesh);

      // 5. PULSANTE START GIOCO
      btnStartMesh = create3DButton("▶ START GIOCO", 0.43, 0.11, "#00ffcc");
      btnStartMesh.position.set(0.21, -0.62, 0);
      btnStartMesh.userData = { action: 'toggle_start' };
      hudGroup.add(btnStartMesh);
      hudButtons.push(btnStartMesh);

      // 6. Cambia Minigioco
      btnGameSelectMesh = create3DButton("Cambia Gioco 🔄", 0.88, 0.11);
      btnGameSelectMesh.position.set(-0.02, -0.76, 0);
      btnGameSelectMesh.userData = { action: 'select_game' };
      hudGroup.add(btnGameSelectMesh);
      hudButtons.push(btnGameSelectMesh);

      scene.add(hudGroup);
    }

    function updateHudTexture() {
      hudCtx.fillStyle = '#0a0f1e';
      hudCtx.fillRect(0, 0, 512, 360);

      hudCtx.strokeStyle = '#00ffcc';
      hudCtx.lineWidth = 8;
      hudCtx.strokeRect(4, 4, 504, 352);

      hudCtx.fillStyle = '#ff2a6d';
      hudCtx.font = 'bold 26px Arial';
      hudCtx.fillText('BANG BANG BONANZA', 28, 42);

      hudCtx.fillStyle = '#ffffff';
      hudCtx.font = 'bold 18px Arial';
      hudCtx.fillText('Versione: v2.2.0', 28, 75);

      hudCtx.fillStyle = gameState === 'PLAYING' ? '#00ffcc' : '#ffb703';
      hudCtx.font = 'bold 20px Arial';
      hudCtx.fillText('Stato: ' + (gameState === 'PLAYING' ? 'IN GIOCO' : 'PRESENTAZIONE'), 28, 108);

      const selectedName = miniGameList[currentMiniGameIndex] ? new miniGameList[currentMiniGameIndex]().name : 'Minigioco 1';
      hudCtx.fillStyle = '#00ffcc';
      hudCtx.font = 'bold 20px Arial';
      hudCtx.fillText('Gioco: ' + selectedName, 28, 142);

      hudCtx.fillStyle = heightMode === 'SEATED' ? '#ffb703' : '#00ffcc';
      hudCtx.font = 'bold 20px Arial';
      hudCtx.fillText('Posizione: ' + (heightMode === 'SEATED' ? '🪑 SEDUTO' : '🧍 IN PIEDI'), 28, 176);

      hudCtx.fillStyle = score >= 0 ? '#00ffcc' : '#ff2a6d';
      hudCtx.font = 'bold 30px Arial';
      hudCtx.fillText('Punti: ' + score, 28, 235);

      const degPitch = Math.round(THREE.MathUtils.radToDeg(currentGunPitch));
      hudCtx.fillStyle = '#ffb703';
      hudCtx.font = 'bold 20px Arial';
      hudCtx.fillText('Inclinazione: ' + degPitch + '°', 28, 285);

      hudTexture.needsUpdate = true;
    }

    function create3DButton(label, width, height, strokeColor = '#00ffcc') {
      const btnCanvas = document.createElement('canvas');
      btnCanvas.width = 300;
      btnCanvas.height = 100;
      const ctx = btnCanvas.getContext('2d');

      ctx.fillStyle = '#0d222a';
      ctx.fillRect(0, 0, 300, 100);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 292, 92);

      ctx.fillStyle = strokeColor;
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 150, 50);

      const btnTex = new THREE.CanvasTexture(btnCanvas);
      const geo = new THREE.BoxGeometry(width, height, 0.04);
      const mat = new THREE.MeshStandardMaterial({ map: btnTex, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { canvas: btnCanvas, ctx: ctx, texture: btnTex };

      return mesh;
    }

    function update3DButtonText(btnMesh, label, colorHex = '#00ffcc') {
      const ctx = btnMesh.userData.ctx;
      ctx.fillStyle = '#0d222a';
      ctx.fillRect(0, 0, 300, 100);
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 292, 92);

      ctx.fillStyle = colorHex;
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 150, 50);

      btnMesh.userData.texture.needsUpdate = true;
    }

    // MODELLO PISTOLA ROSSA CON MIRINO AD ANELLO
    function createRedGunModel() {
      const gunGroup = new THREE.Group();

      const redGunMat = new THREE.MeshStandardMaterial({ 
        color: 0xe60000, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const blackDetailMat = new THREE.MeshStandardMaterial({ 
        color: 0x111111, 
        roughness: 0.6 
      });

      // Canna
      const barrelGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.26, 16);
      barrelGeo.rotateX(Math.PI / 2);
      const barrel = new THREE.Mesh(barrelGeo, redGunMat);
      barrel.position.set(0, 0, -0.1);
      gunGroup.add(barrel);

      // Impugnatura
      const handleGeo = new THREE.BoxGeometry(0.03, 0.12, 0.04);
      const handle = new THREE.Mesh(handleGeo, blackDetailMat);
      handle.position.set(0, -0.05, 0.02);
      handle.rotation.x = -0.3;
      gunGroup.add(handle);

      // Mirino ad Anello
      const ringGeo = new THREE.TorusGeometry(0.015, 0.003, 8, 24);
      const ringMesh = new THREE.Mesh(ringGeo, blackDetailMat);
      ringMesh.position.set(0, 0.032, 0.02);
      gunGroup.add(ringMesh);

      // Mirino Anteriore
      const frontSightGeo = new THREE.BoxGeometry(0.004, 0.012, 0.004);
      const frontSightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const frontSight = new THREE.Mesh(frontSightGeo, frontSightMat);
      frontSight.position.set(0, 0.026, -0.22);
      gunGroup.add(frontSight);

      // Laser
      const laserGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.23),
        new THREE.Vector3(0, 0, -15)
      ]);
      const laserMat = new THREE.LineBasicMaterial({ 
        color: 0xff0000, 
        transparent: true, 
        opacity: 0.6 
      });
      const laserLine = new THREE.Line(laserGeo, laserMat);
      laserLine.visible = laserEnabled;
      gunGroup.add(laserLine);
      laserLines.push(laserLine);

      return gunGroup;
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);

        const pivot = new THREE.Group();
        const gun = createRedGunModel();
        
        pivot.add(gun);
        controller.add(pivot);

        controller.addEventListener('selectstart', onXRShoot);

        scene.add(controller);
        controllers.push(controller);
        gunPivots.push(pivot);
      }
    }

    function updateGunRotation() {
      gunPivots.forEach(pivot => {
        pivot.rotation.x = currentGunPitch;
      });
      updateHudTexture();
    }

    function toggleLaser() {
      laserEnabled = !laserEnabled;
      laserLines.forEach(line => line.visible = laserEnabled);
      update3DButtonText(btnLaserToggleMesh, laserEnabled ? "Laser: ON" : "Laser: OFF");
    }

    function onXRShoot(event) {
      const controller = event.target;
      const pivot = controller.children.find(c => gunPivots.includes(c));
      if (!pivot) return;

      const origin = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();

      pivot.getWorldPosition(origin);
      pivot.getWorldQuaternion(worldQuat);

      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(worldQuat);
      processShot(origin, direction);
    }

    function onDesktopShoot(event) {
      if (renderer.xr.isPresenting) return;

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );

      raycaster.setFromCamera(mouse, camera);
      processShot(raycaster.ray.origin, raycaster.ray.direction);
    }

    function processShot(origin, direction) {
      playGunshotSound();

      const raycaster = new THREE.Raycaster(origin, direction);

      const gameTargets = (activeMiniGame && gameState === 'PLAYING') ? activeMiniGame.getTargetObjects() : [];
      const candidates = [...gameTargets, ...hudButtons];

      const intersects = raycaster.intersectObjects(candidates, false);
      let endPoint = origin.clone().add(direction.clone().multiplyScalar(25));

      if (intersects.length > 0) {
        const hit = intersects[0];
        endPoint = hit.point;

        const hitBtn = hudButtons.find(b => b === hit.object);
        if (hitBtn) {
          playPopSound(false);

          if (hitBtn.userData.action === 'pitch_down') {
            currentGunPitch += THREE.MathUtils.degToRad(1);
            updateGunRotation();
          } else if (hitBtn.userData.action === 'pitch_up') {
            currentGunPitch -= THREE.MathUtils.degToRad(1);
            updateGunRotation();
          } else if (hitBtn.userData.action === 'toggle_laser') {
            toggleLaser();
          } else if (hitBtn.userData.action === 'toggle_height') {
            heightMode = (heightMode === 'STANDING') ? 'SEATED' : 'STANDING';
            applyHeightMode();
          } else if (hitBtn.userData.action === 'select_game') {
            switchNextMiniGame();
          } else if (hitBtn.userData.action === 'toggle_start') {
            if (gameState === 'LOBBY') {
              startSelectedGame();
            } else {
              stopCurrentGame();
            }
          }
        } else if (activeMiniGame && gameState === 'PLAYING') {
          const pointsEarned = activeMiniGame.onHit(hit.object);
          if (pointsEarned !== 0) {
            playPopSound(pointsEarned < 0);
            score += pointsEarned;
            updateHudTexture();
          }
        }
      }

      createTracer(origin, endPoint);
    }

    function createTracer(start, end) {
      const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
      const mat = new THREE.LineBasicMaterial({
        color: 0xffff00,
        transparent: true,
        opacity: 1.0
      });
      const line = new THREE.Line(geo, mat);
      line.userData = { life: 0.06 };
      scene.add(line);
      tracers.push(line);
    }

    function updateTracers(delta) {
      for (let i = tracers.length - 1; i >= 0; i--) {
        const tracer = tracers[i];
        tracer.userData.life -= delta;
        if (tracer.userData.life <= 0) {
          scene.remove(tracer);
          tracer.geometry.dispose();
          tracer.material.dispose();
          tracers.splice(i, 1);
        } else {
          tracer.material.opacity = tracer.userData.life / 0.06;
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();

      if (activeMiniGame && gameState === 'PLAYING') {
        activeMiniGame.update(delta);
      }

      updateTracers(delta);

      renderer.render(scene, camera);
    }
  </script>
</body>
