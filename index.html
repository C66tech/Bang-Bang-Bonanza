<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="game-version" content="1.3.0">
  <!-- TAG ANTI-CACHE ESTREMI -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Expires" content="Tue, 01 Jan 1980 1:00:00 GMT">

  <title>Point Panic! XR - v1.3.0</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

    #xr-button-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 999;
    }

    .xr-btn {
      padding: 12px 24px; font-size: 16px; font-weight: bold; color: #fff;
      background: rgba(0, 0, 0, 0.8); border: 2px solid #fff; border-radius: 8px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .xr-btn:hover { background: #fff; color: #000; }
    .xr-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #888; color: #ff5555; }

    #version-badge {
      position: absolute; top: 15px; left: 15px; color: #00ffcc;
      font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.6);
      padding: 6px 12px; border-radius: 4px; border: 1px solid #00ffcc; z-index: 999;
    }
    
    #debug-log {
      position: absolute; top: 60px; left: 15px; color: #ffcc00;
      font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.8);
      padding: 10px; z-index: 1000; display: none; max-width: 80%;
    }
  </style>

  <!-- LIBRERIE THREE.JS NECESSARIE PER I CONTROLLER VIRTUALI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XRControllerModelFactory.js"></script>
</head>
<body>

<div id="version-badge">v1.3.0</div>
<div id="debug-log"></div>

<div id="xr-button-container">
  <button id="vr-btn" class="xr-btn">ATTENDI...</button>
  <button id="ar-btn" class="xr-btn">ATTENDI...</button>
</div>

<script>
  // Log a schermo per il debug
  function log(msg) {
    const el = document.getElementById('debug-log');
    el.style.display = 'block';
    el.innerHTML += msg + '<br>';
  }
  window.addEventListener('error', function(e) { log(`[ERRORE] ${e.message}`); });

  const GAME_VERSION = "v1.3.0";

  let scene, camera, renderer, controller, controllerGrip;
  let raycaster, tempMatrix;
  let currentSession = null;
  
  let hudCanvas, hudContext, hudTexture, hudMesh;
  let laserLine;
  let laserEnabled = true;

  let score = 0;
  let activeTargets = [];
  const TARGET_LIFESPAN = 2000;

  const COLOR_CONFIG = [
    { color: 0xff0000, points: 10 },
    { color: 0x00ff00, points: 10 },
    { color: 0x0000ff, points: 10 },
    { color: 0xffff00, points: 20 },
    { color: 0x111111, points: -30 }
  ];

  try {
    init();
    animate();
  } catch (e) {
    log(`Init fallito: ${e.message}`);
  }

  function init() {
    scene = new THREE.Scene();
    
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 1);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(0, 5, 5).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x606060));

    const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(gridHelper);

    raycaster = new THREE.Raycaster();
    tempMatrix = new THREE.Matrix4();

    // ========================================================
    // 1. GESTIONE TARGET RAY (Mirino e logica di sparo)
    // ========================================================
    controller = renderer.xr.getController(0);
    controller.addEventListener('selectstart', onTriggerPress);
    scene.add(controller);

    const gunGroup = new THREE.Group();
    
    // Canna (posizionata leggermente in avanti rispetto al controller)
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.015, 0.015, 0.25),
      new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 })
    );
    barrel.rotation.x = -Math.PI / 2;
    barrel.position.set(0, 0, -0.15); // Offset per non compenetrare il controller
    gunGroup.add(barrel);

    // Laser
    const laserGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, -0.27), // Parte dalla punta della canna
      new THREE.Vector3(0, 0, -5)
    ]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0xff00cc, opacity: 0.8, transparent: true });
    laserLine = new THREE.Line(laserGeo, laserMat);
    gunGroup.add(laserLine);

    controller.add(gunGroup);

    // ========================================================
    // 2. GESTIONE GRIP SPACE (Modello visivo del Controller)
    // ========================================================
    const controllerModelFactory = new THREE.XRControllerModelFactory();
    controllerGrip = renderer.xr.getControllerGrip(0);
    const controllerModel = controllerModelFactory.createControllerModel(controllerGrip);
    controllerGrip.add(controllerModel);
    scene.add(controllerGrip);
    // ========================================================

    createLeftHUD();
    setupXRButtons();

    setInterval(spawnTarget, 800);
  }

  function createLeftHUD() {
    hudCanvas = document.createElement('canvas');
    hudCanvas.width = 512;
    hudCanvas.height = 512;
    hudContext = hudCanvas.getContext('2d');

    hudTexture = new THREE.CanvasTexture(hudCanvas);
    const hudMaterial = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
    const hudGeometry = new THREE.PlaneGeometry(0.8, 0.8);

    hudMesh = new THREE.Mesh(hudGeometry, hudMaterial);
    hudMesh.position.set(-1.2, 1.4, -1.5);
    hudMesh.rotation.y = Math.PI / 6;

    scene.add(hudMesh);
    updateHUDText();
  }

  function updateHUDText() {
    hudContext.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
    
    hudContext.fillStyle = 'rgba(10, 15, 30, 0.85)';
    hudContext.fillRect(10, 10, 492, 492);
    hudContext.strokeStyle = '#00ffcc';
    hudContext.lineWidth = 6;
    hudContext.strokeRect(10, 10, 492, 492);

    hudContext.fillStyle = '#00ffcc';
    hudContext.font = 'bold 36px monospace';
    hudContext.fillText('POINT PANIC! XR', 40, 60);

    hudContext.fillStyle = '#ffffff';
    hudContext.font = '28px monospace';
    hudContext.fillText(`VERSION: ${GAME_VERSION}`, 40, 100);

    hudContext.strokeStyle = '#00ffcc';
    hudContext.lineWidth = 2;
    hudContext.beginPath();
    hudContext.moveTo(40, 120);
    hudContext.lineTo(470, 120);
    hudContext.stroke();

    hudContext.fillStyle = '#ffcc00';
    hudContext.font = 'bold 42px monospace';
    hudContext.fillText(`SCORE: ${score}`, 40, 180);

    hudContext.fillStyle = '#cccccc';
    hudContext.font = '24px sans-serif';
    hudContext.fillText('Minigame 1: Sphere Panic', 40, 230);
    hudContext.fillText('• Red/Green/Blue: +10', 40, 270);
    hudContext.fillText('• Yellow Bonus:  +20', 40, 310);
    hudContext.fillText('• Black Penalty: -30', 40, 350);

    // Disegno Bottone HUD
    hudContext.fillStyle = laserEnabled ? '#00ffcc' : '#555555';
    hudContext.fillRect(40, 400, 220, 60);
    
    hudContext.fillStyle = laserEnabled ? '#000000' : '#ffffff';
    hudContext.font = 'bold 24px monospace';
    hudContext.fillText(laserEnabled ? 'LASER: ON' : 'LASER: OFF', 65, 438);

    hudTexture.needsUpdate = true;
  }

  function setupXRButtons() {
    const vrBtn = document.getElementById('vr-btn');
    const arBtn = document.getElementById('ar-btn');

    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        vrBtn.disabled = !supported;
        vrBtn.textContent = supported ? 'ENTER VR' : 'VR NON SUPP.';
      });
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        arBtn.disabled = !supported;
        arBtn.textContent = supported ? 'ENTER AR' : 'AR NON SUPP.';
      });

      vrBtn.addEventListener('click', () => onRequestSession('immersive-vr'));
      arBtn.addEventListener('click', () => onRequestSession('immersive-ar'));
    } else {
      vrBtn.disabled = true;
      arBtn.disabled = true;
      vrBtn.textContent = 'NO API XR';
      arBtn.textContent = 'NO API XR';
      log("WebXR non supportato o bloccato (Serve HTTPS).");
    }
  }

  async function onRequestSession(mode) {
    if (currentSession) {
      currentSession.end();
      return;
    }
    try {
      const session = await navigator.xr.requestSession(mode, {
        optionalFeatures: ['local-floor', 'bounded-floor']
      });
      currentSession = session;
      renderer.xr.setSession(session);

      if (mode === 'immersive-ar') {
        scene.background = null;
      } else {
        scene.background = new THREE.Color(0x111122);
      }

      session.addEventListener('end', () => {
        currentSession = null;
        document.getElementById('vr-btn').textContent = 'ENTER VR';
        document.getElementById('ar-btn').textContent = 'ENTER AR';
        scene.background = new THREE.Color(0x000000);
      });

      document.getElementById('vr-btn').textContent = mode === 'immersive-vr' ? 'EXIT VR' : 'ENTER VR';
      document.getElementById('ar-btn').textContent = mode === 'immersive-ar' ? 'EXIT AR' : 'ENTER AR';

    } catch (e) {
      log(`Errore avvio XR: ${e.message}`);
    }
  }

  function spawnTarget() {
    const config = COLOR_CONFIG[Math.floor(Math.random() * COLOR_CONFIG.length)];
    const geometry = new THREE.SphereGeometry(0.12, 16, 16);
    const material = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.3 });
    const sphere = new THREE.Mesh(geometry, material);

    sphere.position.x = (Math.random() - 0.5) * 2;
    sphere.position.y = 1.0 + Math.random() * 1.0;
    sphere.position.z = -1.2 - Math.random() * 1.3;

    sphere.userData = { points: config.points, spawnTime: performance.now() };

    scene.add(sphere);
    activeTargets.push(sphere);
  }

  function onTriggerPress() {
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    const hudIntersects = raycaster.intersectObject(hudMesh);
    if (hudIntersects.length > 0) {
      const uv = hudIntersects[0].uv;
      const clickX = uv.x * 512;
      const clickY = (1 - uv.y) * 512;

      if (clickX >= 40 && clickX <= 260 && clickY >= 400 && clickY <= 460) {
        laserEnabled = !laserEnabled;
        laserLine.visible = laserEnabled;
        updateHUDText();
        return; 
      }
    }

    const targetIntersects = raycaster.intersectObjects(activeTargets);
    if (targetIntersects.length > 0) {
      const hitObject = targetIntersects[0].object;
      score += hitObject.userData.points;
      updateHUDText();
      destroyTarget(hitObject);
    }
  }

  function destroyTarget(target) {
    scene.remove(target);
    target.geometry.dispose();
    target.material.dispose();
    activeTargets = activeTargets.filter(t => t !== target);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render() {
    const now = performance.now();
    for (let i = activeTargets.length - 1; i >= 0; i--) {
      const target = activeTargets[i];
      if (now - target.userData.spawnTime > TARGET_LIFESPAN) {
        destroyTarget(target);
      }
    }
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
