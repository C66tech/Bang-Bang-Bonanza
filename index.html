<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- TAG META ANTI-CACHE -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Bang Bang Bonanza - WebXR Target Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
  </style>

  <!-- Import Map Three.js via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let scene, camera, renderer;
    let controllers = [];
    let gunPivots = [];
    let laserLines = [];
    let tracers = [];
    let targets = [];
    let hudButtons = [];
    let score = 0;
    
    // INCLINAZIONE DI DEFAULT A -15 GRADI
    let currentGunPitch = THREE.MathUtils.degToRad(-15);
    let laserEnabled = true;
    
    // Web Audio API Context
    let audioCtx = null;

    // Elementi HUD 3D
    let hudCanvas, hudCtx, hudTexture;
    let btnPitchDownMesh, btnPitchUpMesh, btnLaserToggleMesh;

    const clock = new THREE.Clock();

    init();

    function init() {
      // 1. Scena 3D
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101020);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      // 3. Illuminazione
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 4. Renderer WebGL + WebXR
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 5. Bottoni di ingresso VR e AR
      document.body.appendChild(VRButton.createButton(renderer));
      document.body.appendChild(ARButton.createButton(renderer));

      // 6. Setup Controller e Pistola
      setupControllers();

      // 7. Setup HUD 3D Nello Spazio VR
      create3DHUD();

      // Applicazione inclinazione iniziale (-15°)
      updateGunRotation();

      // 8. Spawna bersagli vicino al pavimento
      for (let i = 0; i < 8; i++) {
        spawnTarget();
      }

      window.addEventListener('resize', onWindowResize);

      // Inizializza Audio al primo click
      window.addEventListener('click', initAudio, { once: true });

      // Render Loop per WebXR
      renderer.setAnimationLoop(animate);
    }

    // --- SINTETIZZATORE AUDIO WEB AUDIO API ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playGunshotSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1400, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + 0.12);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start(now);
    }

    function playPopSound() {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(350, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.08);
    }

    // --- CREAZIONE HUD 3D SPAZIALE IN VR ---
    function create3DHUD() {
      const hudGroup = new THREE.Group();
      hudGroup.position.set(-1.2, 1.3, -1.8);
      hudGroup.rotation.y = THREE.MathUtils.degToRad(25);

      hudCanvas = document.createElement('canvas');
      hudCanvas.width = 512;
      hudCanvas.height = 280;
      hudCtx = hudCanvas.getContext('2d');

      hudTexture = new THREE.CanvasTexture(hudCanvas);
      updateHudTexture();

      const panelGeo = new THREE.PlaneGeometry(1.1, 0.6);
      const panelMat = new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide });
      const panelMesh = new THREE.Mesh(panelGeo, panelMat);
      hudGroup.add(panelMesh);

      // --- PULSANTI 3D SPARABILI ---
      btnPitchDownMesh = create3DButton("Inclina Avanti ⤵", 0.32, 0.14);
      btnPitchDownMesh.position.set(-0.36, -0.42, 0);
      btnPitchDownMesh.userData = { action: 'pitch_down' };
      hudGroup.add(btnPitchDownMesh);
      hudButtons.push(btnPitchDownMesh);

      btnPitchUpMesh = create3DButton("Inclina Indietro ⤴", 0.32, 0.14);
      btnPitchUpMesh.position.set(0, -0.42, 0);
      btnPitchUpMesh.userData = { action: 'pitch_up' };
      hudGroup.add(btnPitchUpMesh);
      hudButtons.push(btnPitchUpMesh);

      btnLaserToggleMesh = create3DButton("Laser: ON", 0.32, 0.14);
      btnLaserToggleMesh.position.set(0.36, -0.42, 0);
      btnLaserToggleMesh.userData = { action: 'toggle_laser' };
      hudGroup.add(btnLaserToggleMesh);
      hudButtons.push(btnLaserToggleMesh);

      scene.add(hudGroup);
    }

    function updateHudTexture() {
      hudCtx.fillStyle = '#0a0f1e';
      hudCtx.fillRect(0, 0, 512, 280);

      hudCtx.strokeStyle = '#00ffcc';
      hudCtx.lineWidth = 8;
      hudCtx.strokeRect(4, 4, 504, 272);

      // Titolo Gioco
      hudCtx.fillStyle = '#ff2a6d';
      hudCtx.font = 'bold 26px Arial';
      hudCtx.fillText('BANG BANG BONANZA', 30, 48);

      // Versione
      hudCtx.fillStyle = '#ffffff';
      hudCtx.font = 'bold 22px Arial';
      hudCtx.fillText('Versione: v1.6.0', 30, 92);

      // Punti
      hudCtx.fillStyle = '#00ffcc';
      hudCtx.font = 'bold 32px Arial';
      hudCtx.fillText('Punti: ' + score, 30, 160);

      // Inclinazione Pistola in gradi
      const degPitch = Math.round(THREE.MathUtils.radToDeg(currentGunPitch));
      hudCtx.fillStyle = '#ffb703';
      hudCtx.font = 'bold 24px Arial';
      hudCtx.fillText('Inclinazione: ' + degPitch + '°', 30, 220);

      hudTexture.needsUpdate = true;
    }

    function create3DButton(label, width, height) {
      const btnCanvas = document.createElement('canvas');
      btnCanvas.width = 256;
      btnCanvas.height = 100;
      const ctx = btnCanvas.getContext('2d');

      ctx.fillStyle = '#0d222a';
      ctx.fillRect(0, 0, 256, 100);
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 248, 92);

      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 50);

      const btnTex = new THREE.CanvasTexture(btnCanvas);
      const geo = new THREE.BoxGeometry(width, height, 0.04);
      const mat = new THREE.MeshStandardMaterial({ map: btnTex, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { canvas: btnCanvas, ctx: ctx, texture: btnTex };

      return mesh;
    }

    function update3DButtonText(btnMesh, label) {
      const ctx = btnMesh.userData.ctx;
      ctx.fillStyle = '#0d222a';
      ctx.fillRect(0, 0, 256, 100);
      ctx.strokeStyle = laserEnabled ? '#00ffcc' : '#ff2a6d';
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 248, 92);

      ctx.fillStyle = laserEnabled ? '#00ffcc' : '#ff2a6d';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 50);

      btnMesh.userData.texture.needsUpdate = true;
    }

    // Modello Pistola Rossa
    function createRedGunModel() {
      const gunGroup = new THREE.Group();

      const redGunMat = new THREE.MeshStandardMaterial({ 
        color: 0xe60000, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const blackDetailMat = new THREE.MeshStandardMaterial({ 
        color: 0x111111, 
        roughness: 0.6 
      });

      // Canna
      const barrelGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.26, 16);
      barrelGeo.rotateX(Math.PI / 2);
      const barrel = new THREE.Mesh(barrelGeo, redGunMat);
      barrel.position.set(0, 0, -0.1);
      gunGroup.add(barrel);

      // Impugnatura
      const handleGeo = new THREE.BoxGeometry(0.03, 0.12, 0.04);
      const handle = new THREE.Mesh(handleGeo, blackDetailMat);
      handle.position.set(0, -0.05, 0.02);
      handle.rotation.x = -0.3;
      gunGroup.add(handle);

      // Mirino Posteriore
      const rearSightGeo = new THREE.BoxGeometry(0.016, 0.012, 0.005);
      const rearSight = new THREE.Mesh(rearSightGeo, blackDetailMat);
      rearSight.position.set(0, 0.025, 0.02);
      gunGroup.add(rearSight);

      // Mirino Anteriore
      const frontSightGeo = new THREE.BoxGeometry(0.006, 0.012, 0.006);
      const frontSightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const frontSight = new THREE.Mesh(frontSightGeo, frontSightMat);
      frontSight.position.set(0, 0.025, -0.22);
      gunGroup.add(frontSight);

      // Laser
      const laserGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.23),
        new THREE.Vector3(0, 0, -15)
      ]);
      const laserMat = new THREE.LineBasicMaterial({ 
        color: 0xff0000, 
        transparent: true, 
        opacity: 0.6 
      });
      const laserLine = new THREE.Line(laserGeo, laserMat);
      laserLine.visible = laserEnabled;
      gunGroup.add(laserLine);
      laserLines.push(laserLine);

      return gunGroup;
    }

    function setupControllers() {
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);

        const pivot = new THREE.Group();
        const gun = createRedGunModel();
        
        pivot.add(gun);
        controller.add(pivot);

        controller.addEventListener('selectstart', onShoot);

        scene.add(controller);
        controllers.push(controller);
        gunPivots.push(pivot);
      }
    }

    function updateGunRotation() {
      gunPivots.forEach(pivot => {
        pivot.rotation.x = currentGunPitch;
      });
      updateHudTexture();
    }

    function toggleLaser() {
      laserEnabled = !laserEnabled;
      laserLines.forEach(line => line.visible = laserEnabled);
      update3DButtonText(btnLaserToggleMesh, laserEnabled ? "Laser: ON" : "Laser: OFF");
    }

    // --- SISTEMA DI COLLISIONE RAYCASTING (HITSCAN) ---
    function onShoot(event) {
      const controller = event.target;
      playGunshotSound();

      const pivot = controller.children.find(c => gunPivots.includes(c));
      if (!pivot) return;

      const raycaster = new THREE.Raycaster();
      const origin = new THREE.Vector3();
      const worldQuat = new THREE.Quaternion();

      pivot.getWorldPosition(origin);
      pivot.getWorldQuaternion(worldQuat);

      // Direzione del raggio (avanti rispetto alla canna orientata)
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(worldQuat);

      raycaster.set(origin, direction);

      // Oggetti con cui verificare l'impatto istantaneo
      const candidates = [...targets, ...hudButtons];
      const intersects = raycaster.intersectObjects(candidates, false);

      let endPoint = origin.clone().add(direction.clone().multiplyScalar(25));

      if (intersects.length > 0) {
        const hit = intersects[0];
        endPoint = hit.point;

        // Controlla se è stato colpito un pulsante HUD
        const hitBtn = hudButtons.find(b => b === hit.object);
        if (hitBtn) {
          playPopSound();
          if (hitBtn.userData.action === 'pitch_down') {
            currentGunPitch += THREE.MathUtils.degToRad(5);
            updateGunRotation();
          } else if (hitBtn.userData.action === 'pitch_up') {
            currentGunPitch -= THREE.MathUtils.degToRad(5);
            updateGunRotation();
          } else if (hitBtn.userData.action === 'toggle_laser') {
            toggleLaser();
          }
        } else {
          // Controlla se è stato colpito un bersaglio
          const targetIndex = targets.indexOf(hit.object);
          if (targetIndex !== -1) {
            playPopSound();
            scene.remove(hit.object);
            targets.splice(targetIndex, 1);

            score += 100;
            updateHudTexture();

            spawnTarget();
          }
        }
      }

      // Crea un tracciante luminoso istantaneo per il feedback visivo dello sparo
      createTracer(origin, endPoint);
    }

    // Effetto visivo linea tracciante istantanea
    function createTracer(start, end) {
      const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
      const mat = new THREE.LineBasicMaterial({
        color: 0xffff00,
        transparent: true,
        opacity: 1.0
      });
      const line = new THREE.Line(geo, mat);
      line.userData = { life: 0.06 }; // Dissolvenza in 60 millisecondi
      scene.add(line);
      tracers.push(line);
    }

    function updateTracers(delta) {
      for (let i = tracers.length - 1; i >= 0; i--) {
        const tracer = tracers[i];
        tracer.userData.life -= delta;
        if (tracer.userData.life <= 0) {
          scene.remove(tracer);
          tracer.geometry.dispose();
          tracer.material.dispose();
          tracers.splice(i, 1);
        } else {
          tracer.material.opacity = tracer.userData.life / 0.06;
        }
      }
    }

    function spawnTarget() {
      const geo = new THREE.IcosahedronGeometry(0.18, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.2,
        metalness: 0.7
      });
      const target = new THREE.Mesh(geo, mat);

      target.position.x = (Math.random() - 0.5) * 4;
      target.position.y = 0.15 + Math.random() * 0.3; 
      target.position.z = -1.5 - Math.random() * 3;

      scene.add(target);
      targets.push(target);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();

      targets.forEach(t => {
        t.rotation.x += 0.8 * delta;
        t.rotation.y += 1.0 * delta;
      });

      // Aggiorna dissolvenza traccianti visivi
      updateTracers(delta);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
