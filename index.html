<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>XR Target Shooting - Point Blank Style</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
  </style>
  <!-- Three.js e WebXR Button -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/VRButton.js"></script>
</head>
<body>
<script>
  let scene, camera, renderer, controller;
  let raycaster, tempMatrix;
  
  // Logica di Gioco
  let score = 0;
  let activeTargets = [];
  const TARGET_LIFESPAN = 2000; // 2 secondi
  
  // Configurazione Colori e Punteggi
  const COLOR_CONFIG = [
    { color: 0xff0000, points: 10 },  // Rosso
    { color: 0x00ff00, points: 10 },  // Verde
    { color: 0x0000ff, points: 10 },  // Blu
    { color: 0xffff00, points: 20 },  // Giallo (Bonus)
    { color: 0x111111, points: -30 }  // Nero (Malus)
  ];

  init();
  animate();

  function init() {
    // 1. Scena, Camera e Renderer
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // Luce
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 5, 5).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // 2. Controller Destro (Pistola + Raycaster)
    raycaster = new THREE.Raycaster();
    tempMatrix = new THREE.Matrix4();

    // Controller ID 0 (solitamente la mano primaria/destra)
    controller = renderer.xr.getController(0);
    controller.addEventListener('selectstart', onTriggerPress);
    scene.add(controller);

    // Mesh Pistola Semplice (Canna + Impugnatura) e Mirino Laser
    const gunGroup = new THREE.Group();
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.015, 0.015, 0.2),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    barrel.rotation.x = -Math.PI / 2;
    barrel.position.z = -0.1;
    gunGroup.add(barrel);

    // Raggio Laser del Mirino
    const laserGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -5)
    ]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0xff0000, opacity: 0.5, transparent: true });
    const laser = new THREE.Line(laserGeo, laserMat);
    gunGroup.add(laser);

    controller.add(gunGroup);

    // 3. Loop Spawn Target ogni 800ms
    setInterval(spawnTarget, 800);
  }

  function spawnTarget() {
    const config = COLOR_CONFIG[Math.floor(Math.random() * COLOR_CONFIG.length)];
    
    const geometry = new THREE.SphereGeometry(0.12, 16, 16);
    const material = new THREE.MeshStandardMaterial({ 
      color: config.color,
      roughness: 0.3,
      metalness: 0.1
    });
    const sphere = new THREE.Mesh(geometry, material);

    // Posizionamento Casuale: Davanti al giocatore (Z: tra -1.2 e -2.5, X: +/- 1, Y: tra 1 e 2)
    sphere.position.x = (Math.random() - 0.5) * 2;
    sphere.position.y = 1.0 + Math.random() * 1.0;
    sphere.position.z = -1.2 - Math.random() * 1.3;

    sphere.userData = {
      points: config.points,
      spawnTime: performance.now(),
      isBlack: config.points < 0
    };

    scene.add(sphere);
    activeTargets.push(sphere);
  }

  function onTriggerPress() {
    // Calcola il raggio a partire dalla posizione e orientamento del controller
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    const intersects = raycaster.intersectObjects(activeTargets);

    if (intersects.length > 0) {
      const hitObject = intersects[0].object;
      
      // Aggiorna punteggio
      score += hitObject.userData.points;
      console.log(`Colpito! Punti: ${hitObject.userData.points} | Totale: ${score}`);

      // Rimuovi bersaglio
      destroyTarget(hitObject);
    }
  }

  function destroyTarget(target) {
    scene.remove(target);
    target.geometry.dispose();
    target.material.dispose();
    activeTargets = activeTargets.filter(t => t !== target);
  }

  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render() {
    const now = performance.now();

    // Despawn automatico sfere scadute (> 2 secondi)
    for (let i = activeTargets.length - 1; i >= 0; i--) {
      const target = activeTargets[i];
      if (now - target.userData.spawnTime > TARGET_LIFESPAN) {
        destroyTarget(target);
      }
    }

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
